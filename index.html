<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詞語温習室</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#2F4C7A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="詞語温習室">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Nastaliq+Urdu:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
  :root {
    --paper: #FAF6EC;
    --surface: #FFFFFF;
    --paper-line: #DCD3BE;
    --ink: #2B2A28;
    --ink-soft: #6E6A5F;
    --ink-faint: #A39D8C;
    --brand: #2F4C7A;
    --brand-strong: #223A5E;
    --brand-soft: #E4ECF7;
    --accent: #B8433A;
    --accent-soft: #F6E4DF;
    --success: #3F8F5F;
    --mark-red: #D6362B;
    --shadow: 0 10px 30px -12px rgba(43, 42, 40, 0.28);
    /* 全站中文字用楷體風格：首選「大萌秀楷」（自家字體檔，所有裝置一樣）；
       罕用字唔喺縮細版入面，就用裝置自己嘅標楷體（Windows 嘅標楷體／DFKai-SB、
       Mac 嘅 BiauKai／楷體-繁），再冇就用網上字體「霞鶩文楷 TC」頂上。字體只管
       中日韓漢字範圍，英文／數字唔會被攞走。 */
    --font-kai: "DaMengXiuKai", "KaiLocal", "LXGW WenKai TC", "Noto Serif TC", "Noto Sans TC", serif;
    font-family: var(--font-kai);
    /* 大萌秀楷只有一個字重（本身已經幾粗），唔好由瀏覽器再加粗，否則筆畫會糊成一團 */
    font-synthesis-weight: none;
  }
  /* 主字體：大萌秀楷（完整字體檔，所有字都有）。fonts/DaMengXiuKai.woff2 係同一隻
     字體壓縮咗嘅格式（下載細啲、字形完全一樣）；原檔 fonts/DaMengXiuKai-Regular-2.ttf
     做後備同備份。字體入面冇嘅字（例如「衞」）會自動用下面嗰啲楷體頂上。 */
  @font-face {
    font-family: "DaMengXiuKai";
    src: url("fonts/DaMengXiuKai.woff2") format("woff2"),
         url("fonts/DaMengXiuKai-Regular-2.ttf") format("truetype");
    font-display: swap;
    unicode-range: U+2E80-2FDF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
  }
  @font-face {
    font-family: "KaiLocal";
    src: local("標楷體"), local("DFKai-SB"), local("BiauKai"), local("Kaiti TC"), local("Kaiti SC"),
         local("STKaiti"), local("KaiTi"), local("Kai");
    unicode-range: U+2E80-2FDF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1E1C18;
      --surface: #2A2721;
      --paper-line: #3C382E;
      --ink: #EDE8DC;
      --ink-soft: #B4AC9C;
      --ink-faint: #766F5F;
      --brand: #8CADE0;
      --brand-strong: #AFC7EC;
      --brand-soft: #2A3B54;
      --accent: #E28B80;
      --accent-soft: #40302B;
      --success: #6FBE8C;
      --mark-red: #FF7A6E;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1E1C18;
    --surface: #2A2721;
    --paper-line: #3C382E;
    --ink: #EDE8DC;
    --ink-soft: #B4AC9C;
    --ink-faint: #766F5F;
    --brand: #8CADE0;
    --brand-strong: #AFC7EC;
    --brand-soft: #2A3B54;
    --accent: #E28B80;
    --accent-soft: #40302B;
    --success: #6FBE8C;
    --mark-red: #FF7A6E;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-kai);
    line-height: 1.5;
  }
  h1, h2, h3 { font-family: var(--font-kai); margin: 0; text-wrap: balance; }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  .app {
    max-width: 880px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 56px;
  }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    margin-inline: -16px;
    margin-bottom: 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--paper-line);
  }
  .topbar-titles { flex: 1 1 auto; min-width: 0; }
  .lang-switch { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  .lang-switch--modal { margin: 0 40px 10px 0; justify-content: flex-start; }
  .lang-btn {
    border: 1px solid var(--paper-line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .lang-btn:hover { border-color: var(--brand); color: var(--brand-strong); }
  .lang-btn[aria-pressed="true"] {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--surface);
  }
  .lang-btn[lang="ur"] { font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; font-size: 14px; }

  /* ---- 加到主畫面（PWA安裝）掣：擺喺右上角，等學生一撳就可以將個網站
     當做App咁裝落手機主畫面，唔使成日開瀏覽器揾返個網址。 ---- */
  .site-lang { display: flex; gap: 2px; margin-left: auto; flex: none; padding: 2px; border: 1px solid var(--paper-line); border-radius: 999px; background: var(--surface); }
  .site-lang + .install-btn { margin-left: 0; }
  .site-lang-btn {
    border: 0; background: none; color: var(--ink-soft);
    font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .site-lang-btn:hover { color: var(--brand-strong); }
  .site-lang-btn[aria-pressed="true"] { background: var(--brand); color: var(--surface); }
  .install-btn {
    margin-left: auto;
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-strong);
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .install-btn:hover { background: var(--brand); color: var(--surface); }
  .install-btn-icon { font-size: 14px; line-height: 1; }
  .install-modal { max-width: 380px; padding: 20px 20px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .install-modal-title { font-size: 18px; font-weight: 700; padding-right: 34px; margin-bottom: 4px; }
  .install-steps { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
  .install-steps li { font-size: 14px; line-height: 1.5; color: var(--ink); }
  .install-steps .key { display: inline-block; border: 1px solid var(--paper-line); background: var(--paper); border-radius: 6px; padding: 1px 7px; font-family: "IBM Plex Mono", monospace; font-size: 12px; margin: 0 1px; }

  .topbar .mark {
    width: 34px; height: 34px;
    border-radius: 6px;
    background: var(--brand);
    color: var(--surface);
    display: grid; place-items: center;
    font-family: var(--font-kai);
    font-weight: 700;
    font-size: 17px;
    flex: none;
    box-shadow: var(--shadow);
  }
  .topbar h1 { font-size: 19px; font-weight: 700; color: var(--ink); }
  .topbar .tagline { font-size: 12px; color: var(--ink-soft); }

  /* ---- Accordion steps ---- */
  .step {
    background: var(--surface);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color .2s ease;
  }
  .step[data-state="done"] { border-color: var(--paper-line); }
  .step[data-state="active"] { border-color: var(--brand); box-shadow: var(--shadow); }
  .step[data-state="locked"] { opacity: .55; }

  .step-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }
  .step[data-state="locked"] .step-head { cursor: default; }
  .step-badge {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 6px;
    display: grid; place-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 13px;
    background: var(--brand-soft);
    color: var(--brand);
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .step[data-state="done"] .step-badge { background: var(--success); color: var(--surface); background-image:none; }
  .step-titles { flex: 1; min-width: 0; }
  .step-eyebrow { font-size: 11px; letter-spacing: .06em; color: var(--ink-faint); text-transform: uppercase; }
  .step-value { font-size: 15px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-value.placeholder { color: var(--ink-faint); font-weight: 500; }
  .step-chevron { flex: none; color: var(--ink-faint); font-size: 13px; }

  .step-body { padding: 4px 16px 18px; }
  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .option-btn {
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .option-btn:hover { background: var(--brand-soft); border-color: var(--brand); transform: translateY(-1px); }
  .option-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---- Book cover cards ---- */
  .option-grid--books {
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 14px;
  }
  .book-card {
    border: 1px solid var(--paper-line);
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    padding: 0;
    text-align: left;
    display: flex; flex-direction: column;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .book-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--brand); }
  .book-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .book-cover {
    aspect-ratio: 3 / 4;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book-fallback {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 14px;
    text-align: center;
    background: linear-gradient(160deg, var(--brand), var(--brand-strong));
    color: var(--paper);
    font-family: var(--font-kai);
    font-weight: 700;
    font-size: 15px;
    line-height: 1.4;
  }
  .book-title {
    padding: 8px 10px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
  }

  /* ---- Word grid (田字格 tiles) ---- */
  .lesson-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin: 22px 0 12px;
  }
  .lesson-heading h2 { font-size: 17px; color: var(--ink-soft); font-weight: 600; }
  .lesson-count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }

  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 14px;
  }
  .word-tile {
    background: var(--surface);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 14px 10px 12px;
    cursor: pointer;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .word-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--brand); }
  .word-tile:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .word-tile .glyph {
    width: 74px; height: 74px;
    border-radius: 6px;
    display: grid; place-items: center;
    font-family: var(--font-kai);
    font-weight: 700;
    font-size: 30px;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .word-tile .en {
    font-size: 12px;
    color: var(--ink-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .word-tile .en[dir="rtl"] {
    font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif;
    font-size: 13px;
  }

  .empty-note {
    font-size: 13px;
    color: var(--ink-faint);
    padding: 6px 2px 2px;
  }

  /* ---- Modal ---- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.5);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 100;
    padding: 0;
  }
  @media (min-width: 640px) {
    .scrim { align-items: center; padding: 20px; }
  }
  .modal {
    --img-h: 160px;
    --gap-panel: 8px;
    --ex-pad: 9px 11px;
    --ex-font: 14px;
    --ex-font-en: 13px;
    --stroke-mt: 10px;
    --info-mt: 12px;
    --rtl-lh: 2;
    background: var(--surface);
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    max-height: 92dvh;
    overflow: hidden;
    border-radius: 16px 16px 0 0;
    box-shadow: var(--shadow);
    position: relative;
    padding: 16px 18px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 640px) and (min-height: 480px) {
    .modal { --img-h: 190px; border-radius: 16px; max-height: 88vh; max-height: 88dvh; padding: 22px 22px 24px; }
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .modal-close:hover { color: var(--ink); border-color: var(--brand); }

  .word-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-right: 40px;
  }
  .word-title { font-size: 22px; font-weight: 700; }
  @media (min-width: 640px) {
    .word-title { font-size: 26px; }
  }
  .word-subtitle {
    margin-top: 2px;
    font-size: 13px;
  }
  .word-subtitle.jyutping { font-family: "IBM Plex Mono", monospace; color: var(--ink-soft); }
  .say-btn {
    flex: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-strong);
    font-size: 16px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .12s ease, transform .12s ease;
  }
  .say-btn:hover { background: var(--brand); color: var(--surface); }
  .say-btn:active { transform: scale(.92); }
  .say-status {
    display: block;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  .stroke-panel { margin-top: var(--stroke-mt); }
  .stroke-boxes { display: flex; flex-wrap: nowrap; justify-content: center; gap: 8px; }
  .char-box { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }
  .char-canvas {
    width: 72px; height: 72px;
    border-radius: 8px;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px));
    border: 1px solid var(--paper-line);
  }
  .char-syll {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .char-syll .tone { color: var(--accent); font-weight: 600; }

  .replay-btn {
    margin-top: 8px;
    border: 1px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-strong);
    font-weight: 600;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .replay-btn:hover { background: var(--brand); color: var(--surface); }

  .info-panel { margin-top: var(--info-mt); display: flex; flex-direction: column; gap: var(--gap-panel); }
  .info-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .info-label {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); width: 60px; flex: none;
  }
  .info-value { font-size: 15px; font-weight: 500; }
  .jyutping .tone { color: var(--accent); font-weight: 600; }
  .pos-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-strong);
    background: var(--brand-soft);
    border-radius: 999px;
    padding: 2px 10px;
    flex: none;
  }

  .example {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    padding: var(--ex-pad);
  }
  .example--en { background: var(--brand-soft); }
  .example-text {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: var(--ex-font);
    color: var(--ink);
    padding-top: 1px;
  }
  .example-text--en {
    font-style: italic;
    color: var(--ink-soft);
    font-size: var(--ex-font-en);
  }
  .example-text--en mark { font-style: normal; }
  .example-text mark {
    background: none;
    color: var(--mark-red);
    font-weight: 700;
    padding: 0;
  }
  #modal-english[dir="rtl"],
  .example-text--en[dir="rtl"] {
    direction: rtl;
    text-align: right;
    font-style: normal;
    font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif;
    line-height: var(--rtl-lh);
  }
  .info-value[dir="rtl"] { font-size: 1.05em; }
  .say-btn--sm { width: 28px; height: 28px; font-size: 12px; }

  /* ---- 讀音跟色（karaoke）：讀緊嗰陣，讀到嘅字／詞會逐個著色，等學生睇住跟讀 ----
     唔用背景方格highlight，淨係change文字本身嘅透明度：未讀到嘅字（不論本身係
     一般顏色定係.ro-mark紅色）用淡色顯示，讀到嗰陣先變返實色，等啲字好似逐個
     「亮」返起咁。平時（未撳掣播放之前，或者播完之後）文字要實色，淨係播緊
     嗰陣先至將未讀到嗰啲字變淡——所以「淡」係靠.ro-unread呢個class單獨加落去，
     底色（.ro-tok本身）一定係實色。冇用transition：直接跳轉，唔加任何淡入淡出
     嘅延遲，等個亮燈位盡量貼實際讀音，減少睇落「唔同步」嘅感覺。 */
  .ro-tok { opacity: 1; }
  .ro-tok.ro-unread { opacity: .32; }
  .example-text .ro-mark, .word-title .ro-mark, .info-value .ro-mark {
    color: var(--mark-red);
    font-weight: 700;
  }
  .example-text--en .ro-mark { font-style: normal; }

  .image-wrap {
    margin-top: 2px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    height: var(--img-h);
    display: grid; place-items: center;
  }
  .image-wrap img, .image-wrap video { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; display: block; }
  .image-fallback {
    color: var(--ink-faint);
    font-size: 11px;
    text-align: center;
    padding: 6px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .option-btn, .word-tile, * { transition: none !important; }
  }

  /* ---- 錄音載入中嘅全螢幕遮罩：擋晒所有掣，等用戶知道仲未播到 ---- */
  .audio-loading-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    cursor: wait;
  }
  .audio-loading-overlay .spinner {
    width: 46px; height: 46px;
    border: 4px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: audio-spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .audio-loading-overlay .spinner { animation-duration: 1.6s; }
  }
  @keyframes audio-spin {
    to { transform: rotate(360deg); }
  }

  /* ---- 朗讀默書 ---- */
  .dict-entry {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 14px;
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-strong);
    border-radius: 14px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .dict-entry:hover { background: var(--surface); }
  .dict-entry:active { transform: scale(0.99); }
  .dict-entry-icon { font-size: 26px; line-height: 1; flex: none; }
  .dict-entry-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .dict-entry-text strong { font-size: 16px; }
  .dict-entry-text small { font-size: 12px; color: var(--ink-soft); }
  .dict-entry-chev { flex: none; font-size: 20px; color: var(--ink-faint); }

  .dict-modal {
    display: flex; flex-direction: column;
    max-width: 640px;
    padding: 0;
    max-height: 92vh; max-height: 92dvh;
  }
  .dict-modal[data-mode="setup"] { height: 92vh; height: 92dvh; max-height: 760px; }
  .dict-head {
    flex: none;
    padding: 14px 56px 10px 18px;
    border-bottom: 1px solid var(--paper-line);
  }
  .dict-head h3 { font-size: 19px; }
  .dict-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .dict-modal .modal-close { top: 10px; right: 12px; }
  .dict-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 18px 14px; -webkit-overflow-scrolling: touch; }
  .dict-status { flex: none; margin: 0; padding: 6px 18px; font-size: 12px; color: var(--accent); background: var(--accent-soft); }
  .dict-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 10px 0 6px; letter-spacing: .04em; }
  .dict-label:first-child { margin-top: 0; }
  .dict-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .dict-chip {
    border: 1px solid var(--paper-line);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .dict-chip:hover { border-color: var(--brand); }
  .dict-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--surface); }
  .dict-chip--word { font-size: 15px; padding: 5px 11px; }
  .dict-toolbar { display: flex; gap: 8px; margin: 12px 0 6px; align-items: center; }
  .dict-toolbar .dict-label { margin: 0; flex: 1 1 auto; }
  .dict-link {
    white-space: nowrap;
    border: 0; background: none; padding: 4px 6px;
    color: var(--brand-strong); font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .dict-lesson { border: 1px solid var(--paper-line); background: var(--surface); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .dict-lesson-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 8px; }
  .dict-check {
    flex: none; width: 36px; height: 36px; display: grid; place-items: center;
    border: 0; background: none; cursor: pointer; padding: 0;
  }
  .dict-check-box {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid var(--ink-faint); background: var(--surface);
    display: grid; place-items: center; font-size: 14px; font-weight: 700; line-height: 1; color: var(--surface);
  }
  .dict-check[aria-checked="true"] .dict-check-box,
  .dict-check[aria-checked="mixed"] .dict-check-box { background: var(--brand); border-color: var(--brand); }
  .dict-check[aria-checked="true"] .dict-check-box::after { content: "✓"; }
  .dict-check[aria-checked="mixed"] .dict-check-box::after { content: "–"; }
  .dict-lesson-name {
    flex: 1 1 auto; min-width: 0; text-align: left;
    border: 0; background: none; cursor: pointer;
    padding: 8px 4px; color: var(--ink);
    display: flex; flex-direction: column; gap: 0;
  }
  .dict-lesson-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dict-lesson-count { font-size: 12px; color: var(--ink-faint); }
  .dict-lesson-count.has { color: var(--brand-strong); font-weight: 600; }
  .dict-expand {
    flex: none; border: 1px solid var(--paper-line); background: var(--paper); color: var(--ink-soft);
    font-size: 12px; padding: 5px 9px; border-radius: 999px; cursor: pointer;
  }
  .dict-expand:hover { border-color: var(--brand); color: var(--brand-strong); }
  .dict-lesson-words { padding: 4px 10px 12px 12px; border-top: 1px dashed var(--paper-line); background: var(--paper); }
  .dict-lesson-words .dict-chips { padding-top: 8px; }
  .dict-foot {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--paper-line);
    background: var(--surface);
  }
  .dict-count { flex: 1 1 auto; font-size: 14px; color: var(--ink-soft); }
  .dict-count b { color: var(--brand-strong); font-size: 18px; }
  .dict-btn {
    border: 1.5px solid var(--brand);
    background: var(--surface);
    color: var(--brand-strong);
    font-size: 15px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    transition: background .12s ease, color .12s ease, opacity .12s ease;
  }
  .dict-btn:hover { background: var(--brand-soft); }
  .dict-btn--primary { background: var(--brand); color: var(--surface); }
  .dict-btn--primary:hover { background: var(--brand-strong); }
  .dict-btn[disabled] { opacity: .4; cursor: not-allowed; }
  .dict-btn--big { width: 100%; font-size: 20px; padding: 14px 18px; }

  .dict-play { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-top: 6px; }
  .dict-progress-text { font-size: 15px; color: var(--ink-soft); }
  .dict-progress-text b { font-size: 26px; color: var(--ink); font-family: "IBM Plex Mono", monospace; }
  .dict-bar { width: 100%; height: 8px; border-radius: 999px; background: var(--paper-line); overflow: hidden; }
  .dict-bar > span { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .25s ease; }
  .dict-replay {
    width: 112px; height: 112px; border-radius: 50%;
    border: 3px solid var(--brand); background: var(--brand-soft); color: var(--brand-strong);
    font-size: 44px; cursor: pointer; display: grid; place-items: center;
    transition: transform .1s ease, background .12s ease;
  }
  .dict-replay:hover { background: var(--surface); }
  .dict-replay:active { transform: scale(0.95); }
  .dict-replay-hint { font-size: 13px; color: var(--ink-soft); margin-top: -4px; }
  .dict-play-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .dict-exit-row { font-size: 13px; color: var(--ink-soft); min-height: 30px; display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .dict-done { display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: stretch; }
  .dict-done-icon { font-size: 44px; line-height: 1; }
  .dict-done h4 { margin: 0; font-family: var(--font-kai); font-size: 24px; }
  .dict-reminder-row { display: flex; align-items: center; gap: 8px; text-align: left; }
  .dict-reminder-row .dict-reminder { flex: 1 1 auto; min-width: 0; }
  .dict-reminder {
    background: var(--accent-soft); border: 1.5px solid var(--accent); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.6; font-weight: 600;
  }
  .dict-done-actions { display: flex; flex-direction: column; gap: 8px; }
  .dict-answers { text-align: left; border: 1px solid var(--paper-line); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .dict-answer { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--paper-line); }
  .dict-answer:last-child { border-bottom: 0; }
  .dict-answer-no { flex: none; width: 28px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); text-align: right; }
  .dict-answer-word { font-family: var(--font-kai); font-size: 20px; font-weight: 700; }
  .dict-answer-jp { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); flex: 1 1 auto; min-width: 0; }
  .dict-answer .say-btn { flex: none; }

  @media (max-height: 480px) {
    .dict-head { padding-top: 8px; padding-bottom: 6px; }
    .dict-play { gap: 6px; padding-top: 0; }
    .dict-replay { width: 68px; height: 68px; font-size: 28px; border-width: 2px; }
    .dict-progress-text b { font-size: 20px; }
    .dict-btn--big { font-size: 17px; padding: 9px 14px; }
    .dict-replay-hint { display: none; }
    .dict-done { gap: 8px; }
    .dict-done-icon { font-size: 28px; }
    .dict-done h4 { font-size: 19px; }
    .dict-reminder { font-size: 14px; padding: 8px 10px; }
    .dict-done-actions { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .dict-done-actions .dict-btn { padding: 8px 12px; font-size: 14px; }
  }

  /* ---- 課文朗讀／課文默書 ---- */
  .text-entry { display: flex; gap: 10px; margin: 0 0 14px; }
  .text-entry-btn {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    text-align: left;
    padding: 11px 12px;
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-strong);
    border-radius: 14px;
    cursor: pointer;
    font: inherit;
    transition: background .15s ease, transform .1s ease;
  }
  .text-entry-btn:hover { background: var(--surface); }
  .text-entry-btn:active { transform: scale(0.99); }
  .text-entry-icon { font-size: 24px; line-height: 1; flex: none; }
  .text-entry-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .text-entry-text strong { font-size: 15px; }
  .text-entry-text small { font-size: 11.5px; color: var(--ink-soft); line-height: 1.35; }
  @media (max-width: 340px) {
    .text-entry { flex-direction: column; }
  }

  .tr-modal { height: 92vh; height: 92dvh; max-height: 760px; }
  .tr-controls {
    flex: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--paper-line);
  }
  .tr-controls .dict-btn { padding: 8px 14px; font-size: 15px; }
  .tr-speed { display: flex; gap: 6px; margin-left: auto; }
  .tr-body { padding-top: 14px; }
  .tr-par {
    margin: 0 0 14px;
    font-family: var(--font-kai);
    font-size: 21px;
    line-height: 2;
    text-indent: 2em;
    letter-spacing: .04em;
  }
  .tr-sent {
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 0;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    transition: background .15s ease;
  }
  .tr-sent:hover { background: var(--brand-soft); }
  .tr-sent:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .tr-sent.is-active { background: var(--brand-soft); }

  .td-info { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 4px 0 4px; }
  .td-lesson-name { font-family: var(--font-kai); font-size: 20px; font-weight: 700; margin: 2px 0 4px; }
  .td-legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .td-legend span {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--paper-line); background: var(--surface);
    font-size: 13px;
  }
  .td-legend b { font-family: var(--font-kai); font-size: 16px; color: var(--brand-strong); }
  .td-legend i { font-style: normal; color: var(--ink-faint); font-size: 11.5px; }
  .td-pick-box { border: 1px solid var(--paper-line); border-radius: 12px; background: var(--surface); padding: 8px 12px; max-height: 34vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .td-pick-box .tr-par { font-size: 17px; line-height: 1.95; margin: 0 0 8px; text-indent: 0; }
  .td-pick-box .tr-par:last-child { margin-bottom: 0; }
  .td-ph { cursor: pointer; border-radius: 4px; padding: 1px 0; opacity: .55; }
  .td-ph.in { opacity: 1; background: var(--brand-soft); }
  .td-ph.edge { box-shadow: inset 0 -2px 0 var(--brand); }
  .td-range-sum { font-size: 13px; color: var(--brand-strong); margin: 6px 0 0; min-height: 1.4em; }
  .td-start-row { margin-top: 14px; position: sticky; bottom: 0; background: var(--surface); padding: 8px 0 2px; }
  .td-answer-text { text-align: left; border: 1px solid var(--paper-line); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
  .td-answer-text .tr-par { font-size: 19px; margin-bottom: 8px; }
  .td-answer-text .tr-par:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="mark">語</div>
    <div class="topbar-titles">
      <h1 data-i18n="app_title">詞語温習室</h1>
      <div class="tagline" data-i18n="tagline">揀年級 → 揀課本 → 揀課次 → 溫習詞語</div>
    </div>
    <div class="site-lang" id="site-lang" role="group" data-i18n-label="aria_site_lang" aria-label="介面語言 Interface language">
      <button type="button" class="site-lang-btn" data-site-lang="zh" lang="zh-Hant">中文</button>
      <button type="button" class="site-lang-btn" data-site-lang="en" lang="en">EN</button>
    </div>
    <button type="button" class="install-btn" id="install-btn" hidden>
      <span class="install-btn-icon" aria-hidden="true">⊕</span>
      <span data-i18n="install">加到主畫面</span>
    </button>
  </header>

  <button type="button" class="dict-entry" id="dict-open">
    <span class="dict-entry-icon" aria-hidden="true">✍️</span>
    <span class="dict-entry-text">
      <strong data-i18n="dict_entry_title">朗讀默書</strong>
      <small data-i18n="dict_entry_sub">揀課或詞語，逐個朗讀，你自己寫</small>
    </span>
    <span class="dict-entry-chev" aria-hidden="true">›</span>
  </button>

  <section class="step" id="step-grade" data-state="active">
    <button class="step-head" id="head-grade" aria-expanded="true">
      <span class="step-badge">1</span>
      <span class="step-titles">
        <span class="step-eyebrow" data-i18n="eyebrow_grade">Step 1 · 年級</span>
        <span class="step-value placeholder" id="value-grade">請選擇你的年級</span>
      </span>
      <span class="step-chevron" id="chevron-grade">▾</span>
    </button>
    <div class="step-body" id="body-grade">
      <div class="option-grid" id="grid-grade"></div>
    </div>
  </section>

  <section class="step" id="step-book" data-state="locked">
    <button class="step-head" id="head-book" aria-expanded="false" disabled>
      <span class="step-badge">2</span>
      <span class="step-titles">
        <span class="step-eyebrow" data-i18n="eyebrow_book">Step 2 · 課本</span>
        <span class="step-value placeholder" id="value-book">請先選擇年級</span>
      </span>
      <span class="step-chevron" id="chevron-book">▾</span>
    </button>
    <div class="step-body" id="body-book" hidden>
      <div class="option-grid option-grid--books" id="grid-book"></div>
    </div>
  </section>

  <section class="step" id="step-lesson" data-state="locked">
    <button class="step-head" id="head-lesson" aria-expanded="false" disabled>
      <span class="step-badge">3</span>
      <span class="step-titles">
        <span class="step-eyebrow" data-i18n="eyebrow_lesson">Step 3 · 課次</span>
        <span class="step-value placeholder" id="value-lesson">請先選擇課本</span>
      </span>
      <span class="step-chevron" id="chevron-lesson">▾</span>
    </button>
    <div class="step-body" id="body-lesson" hidden>
      <div class="option-grid" id="grid-lesson"></div>
    </div>
  </section>

  <div id="words-wrap" hidden>
    <div class="lesson-heading">
      <h2 id="lesson-heading-text"></h2>
      <span class="lesson-count" id="word-count"></span>
    </div>
    <div class="text-entry" id="text-entry" hidden>
      <button type="button" class="text-entry-btn" id="text-read-open">
        <span class="text-entry-icon" aria-hidden="true">📖</span>
        <span class="text-entry-text">
          <strong data-i18n="tr_entry_title">課文朗讀</strong>
          <small data-i18n="tr_entry_sub">撳句子聽，或者成篇聽</small>
        </span>
      </button>
      <button type="button" class="text-entry-btn" id="text-dict-open">
        <span class="text-entry-icon" aria-hidden="true">✍️</span>
        <span class="text-entry-text">
          <strong data-i18n="td_entry_title">課文默書</strong>
          <small data-i18n="td_entry_sub">逐個短語連標點默</small>
        </span>
      </button>
    </div>
    <div class="word-grid" id="word-grid"></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-word-title">
    <button class="modal-close" id="modal-close" data-i18n-label="close" aria-label="關閉">✕</button>
    <div class="lang-switch lang-switch--modal" id="lang-switch" role="group" data-i18n-label="aria_meaning_lang" aria-label="揀意思／例句翻譯語言">
      <button type="button" class="lang-btn" data-lang="zh">中文</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="ko">한국어</button>
      <button type="button" class="lang-btn" data-lang="ur" lang="ur">اردو</button>
    </div>
    <div class="word-title-row">
      <h3 class="word-title" id="modal-word-title"></h3>
      <span class="pos-badge" id="modal-pos" hidden></span>
      <button class="say-btn" id="say-btn" type="button" data-i18n-label="aria_say" aria-label="播放讀音">🔊</button>
    </div>
    <div class="word-subtitle jyutping" id="modal-jyutping"></div>
    <span class="say-status" id="say-status" hidden></span>

    <div class="stroke-panel" id="stroke-panel">
      <div class="stroke-boxes" id="stroke-boxes"></div>
      <button class="replay-btn" id="replay-btn" data-i18n="replay_stroke">🔁 重播筆順</button>
    </div>

    <div class="info-panel">
      <div class="info-row">
        <span class="info-label" id="label-english">英文意思</span>
        <span class="info-value" id="modal-english"></span>
        <button class="say-btn say-btn--sm" id="say-english-btn" type="button" data-i18n-label="aria_say" aria-label="播放讀音">🔊</button>
      </div>
      <span class="say-status" id="say-status-english" hidden></span>

      <div class="example">
        <p class="example-text" id="modal-example"></p>

    td_range_all: { zh: "全部", en: "All" },
    td_para: { zh: "第{n}段", en: "Para {n}" },
    td_range_pick_end: { zh: "已揀開頭（第 {a} 個），再撳結尾；撳同一個就只默呢一個", en: "Start set (phrase {a}). Tap the end; tap the same phrase to use only that one." },
    td_range_sel: { zh: "已揀第 {a}–{b} 個短語（共 {c} 個，全文 {n} 個）", en: "Phrases {a}–{b} selected ({c} of {n})" },
    td_range_sel_all: { zh: "已揀全部 {n} 個短語", en: "All {n} phrases selected" }
  };

  function loadSiteLang() {
    try {
      var v = localStorage.getItem("vocabSiteLang");
      if (v === "zh" || v === "en") return v;
    } catch (e) {}
    return "zh";
  }
  var siteLang = loadSiteLang();

  function t(key, params) {
    var e = I18N[key];
    var s = e ? (e[siteLang] || e.zh) : key;
    if (params) s = s.replace(/\{(\w+)\}/g, function (m, k) { return params[k] != null ? params[k] : m; });
    return s;
  }

  // 將靜態HTML入面有 data-i18n（文字）／data-i18n-label（aria-label）嘅元素轉做目前語言
  function applyStaticI18n() {
    document.documentElement.lang = siteLang === "en" ? "en" : "zh-Hant";
    document.title = t("app_title");
    document.querySelectorAll("[data-i18n]").forEach(function (n) {
      var v = t(n.getAttribute("data-i18n"));
      if (/<[a-z]/i.test(v)) n.innerHTML = v; else n.textContent = v;
    });
    document.querySelectorAll("[data-i18n-label]").forEach(function (n) {
      n.setAttribute("aria-label", t(n.getAttribute("data-i18n-label")));
    });
    document.querySelectorAll(".site-lang-btn").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-site-lang") === siteLang ? "true" : "false");
    });
  }

  function toneify(syllable) {
    // "hok6" -> "hok<sup class=tone>6</sup>"
    return syllable.replace(/([a-zA-Z]+)([1-6])$/, '$1<sup class="tone">$2</sup>');
  }

  function jyutpingHtml(jp) {
    if (!jp) return "";
    return jp.split(/\s+/).filter(Boolean).map(toneify).join(" ");
  }

  // 呢度嘅 find*Ranges／find*Range 函數同以前嘅 highlight* 函數做緊同一件事
  // （揾出應該用<mark>顏色標示嘅一段文字），但而家唔再直接砌HTML字串，
  // 淨係返回喺原文入面嘅字元範圍 [start,end)。呢啲範圍會同下面嘅
  // renderKaraoke 一齊用：讀住個字嗰陣要逐字／逐詞著色（跟讀效果），
  // 呢個效果一定要砌返個一個個字嘅<span>先做得到，所以要離開返
  // 「直接輸出HTML字串」呢種寫法，改用範圍(range)嚟表達邊段字要標紅、
  // 等renderKaraoke可以將範圍同span位置對應返埋一齊。
  function findWordRanges(example, word) {
    if (!example || !word) return [];
    var ranges = [];
    var idx = 0;
    while (true) {
      var i = example.indexOf(word, idx);
      if (i === -1) break;
      ranges.push([i, i + word.length]);
      idx = i + word.length;
    }
    return ranges;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  var EN_STOPWORDS = { a: 1, an: 1, the: 1, to: 1, is: 1, are: 1, of: 1, and: 1, or: 1 };

  // 常見不規則動詞（原形 -> 過去式/過去分詞），幫手配對例句入面唔跟一般規則變化嘅字
  var EN_IRREGULAR = {
    write: ["wrote", "written"], hold: ["held"], get: ["got"], put: ["put"],
    give: ["gave", "given"], take: ["took", "taken"], make: ["made"], go: ["went", "gone"],
    come: ["came"], see: ["saw", "seen"], eat: ["ate", "eaten"], buy: ["bought"],
    bring: ["brought"], catch: ["caught"], teach: ["taught"], think: ["thought"],
    feel: ["felt"], keep: ["kept"], sleep: ["slept"], meet: ["met"], tell: ["told"],
    sell: ["sold"], find: ["found"], have: ["had"], do: ["did"], say: ["said"],
    know: ["knew", "known"], grow: ["grew", "grown"], throw: ["threw", "thrown"],
    fly: ["flew", "flown"], draw: ["drew", "drawn"], speak: ["spoke", "spoken"],
    break: ["broke", "broken"], choose: ["chose", "chosen"], wear: ["wore", "worn"],
    begin: ["began", "begun"], drink: ["drank", "drunk"], sing: ["sang", "sung"],
    swim: ["swam", "swum"], run: ["ran"], sit: ["sat"], stand: ["stood"],
    understand: ["understood"], fall: ["fell", "fallen"], hear: ["heard"],
    lose: ["lost"], leave: ["left"], build: ["built"], spend: ["spent"],
    send: ["sent"], win: ["won"]
  };

  function wordAlternatives(wd) {
    var alts = [escapeRegex(wd)];
    if (wd.length >= 4 && /e$/i.test(wd)) alts.push(escapeRegex(wd.slice(0, -1))); // create -> creat(ing)
    var irr = EN_IRREGULAR[wd.toLowerCase()];
    if (irr) irr.forEach(function (f) { alts.push(escapeRegex(f)); });
    return alts;
  }

  function findEnglishGlossRanges(exampleEn, englishGloss) {
    if (!exampleEn) return [];
    var clean = (englishGloss || "").replace(/\([^)]*\)/g, "").trim();
    if (!clean) return [];

    // 1) 先試下成個英文意思係咪照字照樣出現喺例句入面（唔理大小階）
    var exactMatch = exampleEn.match(new RegExp(escapeRegex(clean), "i"));
    var ranges = [];
    if (exactMatch) {
      ranges.push([exactMatch.index, exactMatch.index + exactMatch[0].length]);
    } else {
      // 2) 揾唔到就逐個字試（容許時態/單複數變化，例如 grow -> grown，或者常見不規則動詞；
      //    亦都用逗號/斜線切開多個同義字，例如「decorate, adorn」會分開試 decorate 同 adorn）
      clean.split(/[\s,;\/]+/).map(function (wd) { return wd.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, ""); }).filter(Boolean).forEach(function (wd) {
        var lower = wd.toLowerCase();
        if (EN_STOPWORDS[lower]) return;
        var alts = wordAlternatives(wd);
        var pattern = wd.length >= 4
          ? "\\b(?:" + alts.join("|") + ")\\w*"
          : "\\b" + escapeRegex(wd) + "\\b";
        var m = exampleEn.match(new RegExp(pattern, "i"));
        if (m) ranges.push([m.index, m.index + m[0].length]);
      });
    }

    if (!ranges.length) return [];

    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [ranges[0]];
    for (var i = 1; i < ranges.length; i++) {
      var last = merged[merged.length - 1];
      if (ranges[i][0] <= last[1] + 1) {
        last[1] = Math.max(last[1], ranges[i][1]);
      } else {
        merged.push(ranges[i]);
      }
    }
    return merged;
  }

  // 韓文（或者其他非英文）意思冇英文嗰套時態/不規則變化邏輯可以用，
  // 淨係試下個詞義（去咗括號註解）係咪照字出現喺翻譯句入面，揾到先highlight。
  function findPlainGlossRange(exampleText, gloss) {
    if (!exampleText) return [];
    var clean = (gloss || "").replace(/[（(][^）)]*[）)]/g, "").trim();
    if (!clean) return [];
    var idx = exampleText.indexOf(clean);
    if (idx === -1) return [];
    return [[idx, idx + clean.length]];
  }

  // 老師／Claude 可以喺「例句翻譯」入面用 **文字** 手動標明想highlight嗰部分
  // （唔理係邊種語言都work，因為唔靠自動配對）；有嘅話優先用呢個。返返個
  // 去咗**標記嘅乾淨文字，同埋喺嗰段乾淨文字入面嘅範圍（唔係原文範圍，
  // 因為去馬克之後啲index會偏移咗）。
  function stripMarkupRanges(text) {
    var re = /\*\*([^*]+)\*\*/g;
    var clean = "";
    var ranges = [];
    var lastIndex = 0;
    var m;
    while ((m = re.exec(text))) {
      clean += text.slice(lastIndex, m.index);
      var start = clean.length;
      clean += m[1];
      ranges.push([start, clean.length]);
      lastIndex = re.lastIndex;
    }
    clean += text.slice(lastIndex);
    return { text: clean, ranges: ranges };
  }

  // 揾出呢句「例句翻譯」入面應該著色（對應返個詞語）嘅一段，連同去咗**
  // 標記之後嘅乾淨文字一齊返；有手動**標記就優先用嗰個，冇先至試自動配對
  // （English 有時態/同義字邏輯；其他語言就淨係試下整個詞義照字出現）。
  function exampleTranslationMarkInfo(exampleText, gloss, lang) {
    if (/\*\*[^*]+\*\*/.test(exampleText || "")) {
      return stripMarkupRanges(exampleText);
    }
    var ranges = lang === "en"
      ? findEnglishGlossRanges(exampleText, gloss)
      : findPlainGlossRange(exampleText, gloss);
    return { text: exampleText || "", ranges: ranges };
  }

  /* ---- 讀音跟色（karaoke）：將文字拆做一個個<span>，讀到邊個就著色到邊個 ----
     中文冇分字距，要逐個字先睇到跟色效果；英文／韓文／烏都文就要逐個「詞」（用
     空白隔開嗰段）先包一個span，唔可以逐個字母咁散——尤其烏都文（阿拉伯字母），
     啲字母一定要連住寫先會夾成正確嘅字形，散開晒個span會整到啲字之間斷開、
     顯示錯晒形。 */
  function granularityForLang(langKey) {
    return langKey === "zh" ? "char" : "word";
  }

  function tokenizeWithOffsets(text, granularity) {
    var tokens = [];
    if (granularity === "char") {
      var pos = 0;
      Array.from(text).forEach(function (ch) {
        tokens.push({ text: ch, start: pos, end: pos + ch.length, isSpace: false });
        pos += ch.length;
      });
    } else {
      var re = /\S+|\s+/g;
      var m;
      while ((m = re.exec(text))) {
        tokens.push({ text: m[0], start: m.index, end: m.index + m[0].length, isSpace: /^\s+$/.test(m[0]) });
      }
    }
    return tokens;
  }

  // 起返個containerEl入面嘅內容，逐個token包一個<span class="ro-tok">；同marks
  // 範圍有重疊嗰啲token加多個ro-mark class（代替以前嘅<mark>）。返返嗰啲span
  // 連埋佢哋喺原文入面嘅位置，畀播音嗰陣update顏色用。
  function renderKaraoke(containerEl, text, ranges, granularity) {
    containerEl.innerHTML = "";
    if (!text) return [];
    var tokens = tokenizeWithOffsets(text, granularity);
    var spans = [];
    var frag = document.createDocumentFragment();
    tokens.forEach(function (tok) {
      var span = document.createElement("span");
      span.className = "ro-tok";
      span.textContent = tok.text;
      var marked = (ranges || []).some(function (r) { return tok.start < r[1] && tok.end > r[0]; });
      if (marked) span.classList.add("ro-mark");
      frag.appendChild(span);
      if (!tok.isSpace) spans.push({ el: span, start: tok.start, end: tok.end });
    });
    containerEl.appendChild(frag);
    return spans;
  }

  // 呢三個函數控制「未讀到」嗰陣要淡色（.ro-unread），一讀到就變返實色（冇呢個
  // class）。平時（仲未播放）啲span一開始起好嗰陣本身就冇.ro-unread，所以自然
  // 係實色；karaokeReset淨係喺「即刻要開始播」嗰一刻先至將全部字轉做淡色底。
  function karaokeReset(spans) {
    if (!spans) return;
    spans.forEach(function (s) { s.el.classList.add("ro-unread"); });
  }

  function karaokeSetProgress(spans, charIndex) {
    if (!spans) return;
    spans.forEach(function (s) {
      if (s.start < charIndex) s.el.classList.remove("ro-unread");
      else s.el.classList.add("ro-unread");
    });
  }

  function karaokeComplete(spans) {
    if (!spans) return;
    spans.forEach(function (s) { s.el.classList.remove("ro-unread"); });
  }

  function wordKey(g, b, l) { return g + "|||" + b + "|||" + l; }

  function bookFallbackHtml(title) {
    return '<div class="book-fallback"><span>' + escapeHtml(title) + "</span></div>";
  }

  /* ---------------- Step rendering ---------------- */

  function renderGrades() {
    var grid = el("grid-grade");
    grid.innerHTML = "";
    DATA.grades.forEach(function (g) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";

  function chooseGrade(g) {
    state.grade = g;
    state.book = null;
    state.lesson = null;
    el("value-grade").textContent = g;
    el("value-grade").classList.remove("placeholder");
    setStepState("step-grade", "done");
    collapse("grade");

    var books = DATA.structure[g].books;
    var grid = el("grid-book");
    grid.innerHTML = "";
    books.forEach(function (b) {
      var card = document.createElement("button");

      coverWrap.className = "book-cover";

      if (coverPath) {
        var img = document.createElement("img");

        img.alt = t("alt_cover", { b: b });
        img.onerror = function () { coverWrap.innerHTML = bookFallbackHtml(b); };
        coverWrap.appendChild(img);
      } else {
        coverWrap.innerHTML = bookFallbackHtml(b);
      }
      card.appendChild(coverWrap);

      var title = document.createElement("div");
      title.className = "book-title";
      title.textContent = b;
      card.appendChild(title);

      card.addEventListener("click", function () { chooseBook(b); });

    el("value-book").textContent = t("ph_book");

    el("value-lesson").textContent = t("ph_lesson_locked");
    el("value-lesson").classList.add("placeholder");
    setStepState("step-book", "active");
    setStepState("step-lesson", "locked");
    el("head-book").disabled = false;
    el("head-lesson").disabled = true;
    expand("book");
    collapse("lesson");

  function chooseBook(b) {

    state.lesson = null;
    el("value-book").textContent = b;

  function tileMeaning(w) {
    if (!w.meanings) return "";
    return w.meanings[uiLang] || w.meanings.zh || w.meanings.en || w.meanings.ko || w.meanings.ur || "";
  }

  function renderWords() {

  /* ---------------- Accordion open/close ---------------- */

  function setStepState(stepId, s) {
    el(stepId).setAttribute("data-state", s);
  }

  function expand(name) {
    el("body-" + name).hidden = false;
    el("head-" + name).setAttribute("aria-expanded", "true");
    el("chevron-" + name).textContent = "▴";
    setStepState("step-" + name, "active");
  }

  function collapse(name) {
    el("body-" + name).hidden = true;
    el("head-" + name).setAttribute("aria-expanded", "false");
    el("chevron-" + name).textContent = "▾";

  function toggleStep(name) {

    if (body.hidden) {
      expand(name);

      collapse(name);

  el("head-grade").addEventListener("click", function () { toggleStep("grade"); });
  el("head-book").addEventListener("click", function () { if (!el("head-book").disabled) toggleStep("book"); });
  el("head-lesson").addEventListener("click", function () { if (!el("head-lesson").disabled) toggleStep("lesson"); });

  /* ---------------- Modal + stroke animation ---------------- */

  function cleanupWriters() {
    activeWriters = [];
  }

  function css(varName, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    return v || fallback;
  }

  function buildStrokeBoxes(word, jyutping, maxCanvas) {
    maxCanvas = maxCanvas || 72;
    var wrap = el("stroke-boxes");
    wrap.innerHTML = "";
    cleanupWriters();

    var syllables = (jyutping || "").split(/\s+/).filter(Boolean);
    var chars = word.split("");
    var ink = css("--ink", "#2b2a28");
    var accent = css("--accent", "#b8433a");
    var line = css("--paper-line", "#ccc");

    var gap = 8;
    var containerWidth = wrap.clientWidth || (el("modal").clientWidth - 40) || 300;
    var computed = Math.floor((containerWidth - gap * (chars.length - 1)) / chars.length);
    var size = Math.max(36, Math.min(maxCanvas, computed));

    chars.forEach(function (ch, i) {
      var box = document.createElement("div");
      box.className = "char-box";

      var canvas = document.createElement("div");
      canvas.className = "char-canvas";
      canvas.id = "char-canvas-" + i;
      canvas.style.width = size + "px";
      canvas.style.height = size + "px";
      box.appendChild(canvas);

      var syll = document.createElement("span");
      syll.className = "char-syll";
      syll.innerHTML = syllables[i] ? toneify(syllables[i]) : "";
      box.appendChild(syll);

      wrap.appendChild(box);

      var writer = null;
      if (window.HanziWriter && STROKES[ch]) {
        writer = HanziWriter.create(canvas, ch, {
          width: size,
          height: size,
          padding: Math.max(4, Math.round(size * 0.06)),
          showOutline: true,
          showCharacter: false,
          strokeColor: ink,
          radicalColor: accent,
          outlineColor: line,
          strokeAnimationSpeed: 1,
          delayBetweenStrokes: 150,
          charDataLoader: function (c, onLoad, onError) {
            if (STROKES[c]) onLoad(STROKES[c]); else onError();
          }
        });
      } else {
        canvas.innerHTML = '<div style="display:grid;place-items:center;height:100%;font-family:\'DaMengXiuKai\',\'KaiLocal\',\'LXGW WenKai TC\',\'Noto Serif TC\',serif;font-size:' + Math.round(size * 0.35) + 'px;color:' + ink + '">' + ch + "</div>";
      }
      activeWriters.push(writer);
    });
  }

  var playToken = 0;

  function playSequenceOnce(onDone) {
    var i = 0;
    function next() {
      if (i >= activeWriters.length) { if (onDone) onDone(); return; }
      var w = activeWriters[i];
      if (!w) { i++; next(); return; }
      w.hideCharacter();
      w.animateCharacter({
        onComplete: function () {
          i++;
          setTimeout(next, 250);
        }
      });
    }
    next();
  }

  function startLoop() {
    playToken++;
    var myToken = playToken;
    function runOnce() {
      if (myToken !== playToken) return;
      playSequenceOnce(function () {
        if (myToken !== playToken) return;
        setTimeout(function () {
          if (myToken === playToken) runOnce();
        }, 900);
      });
    }
    runOnce();
  }

  function stopLoop() {
    playToken++;
  }

  var currentWord = null;
  var currentMeaningText = "";
  var currentMeaningLang = "zh";
  var currentExampleTranslationText = "";
  var currentExampleLang = "zh";
  // 每個彈出視窗入面、可以跟讀色嘅四段文字，各自對應嘅<span>清單（畀播音
  // 嗰陣update顏色用）。冇內容或者仲未render過嘅就係null。
  var karaoke = { word: null, example: null, meaning: null, exampleEn: null };

  function loadUiLang() {
    try {
      var v = localStorage.getItem("vocabUiLang");
      if (v && LANGS[v]) return v;
    } catch (e) {}
    return "zh";
  }
  function saveUiLang(v) {
    try { localStorage.setItem("vocabUiLang", v); } catch (e) {}
  }
  var uiLang = "zh"; // 真正嘅初始值喺 LANGS 定義好之後、boot 之前設定（見底下）

  function setRtl(elm, isRtl) {
    if (isRtl) {
      elm.setAttribute("dir", "rtl");
      elm.setAttribute("lang", "ur");
    } else {
      elm.removeAttribute("dir");
      elm.removeAttribute("lang");
    }
  }

  function fallbackMeaning(w) {
    var order = ["en", "zh", "ko", "ur"];
    for (var i = 0; i < order.length; i++) {
      if (w.meanings && w.meanings[order[i]]) return { text: w.meanings[order[i]], lang: order[i] };
    }
    return { text: "", lang: uiLang };
  }

  function fallbackExampleTranslation(w) {
    var order = ["en", "ko", "ur"];
    for (var i = 0; i < order.length; i++) {
      if (w.exampleTranslations && w.exampleTranslations[order[i]]) return { text: w.exampleTranslations[order[i]], lang: order[i] };
    }
    return null;
  }

  // 讀音掣淨係讀返個意思／例句翻譯嘅內容，`**` 標記係畀highlight用嘅，唔應該讀埋出嚟
  function stripMarkup(text) {
    return (text || "").replace(/\*\*/g, "");
  }

  function renderModalMeaning(w) {
    var directMeaning = w.meanings && w.meanings[uiLang];
    var meaningInfo = directMeaning ? { text: directMeaning, lang: uiLang } : fallbackMeaning(w);
    var meaningCfg = LANGS[meaningInfo.lang] || LANGS.zh;

    el("label-english").textContent = t("label_meaning", { lang: t("lang_name_" + meaningInfo.lang) });
    el("say-english-btn").setAttribute("aria-label", t("aria_say_meaning", { lang: t("lang_name_" + meaningInfo.lang) }));
    setRtl(el("modal-english"), meaningCfg.rtl);
    currentMeaningText = stripMarkup(meaningInfo.text);
    currentMeaningLang = meaningInfo.lang;
    if (meaningInfo.text) {
      karaoke.meaning = renderKaraoke(el("modal-english"), currentMeaningText, [], granularityForLang(meaningInfo.lang));
    } else {
      el("modal-english").textContent = "—";
      karaoke.meaning = null;
    }

    if (w.example) {
      karaoke.example = renderKaraoke(el("modal-example"), w.example, findWordRanges(w.example, w.word), "char");
    } else {
      el("modal-example").textContent = t("no_example");
      karaoke.example = null;
    }

    var exInfo = uiLang === "zh"
      ? null
      : ((w.exampleTranslations && w.exampleTranslations[uiLang]) ? { text: w.exampleTranslations[uiLang], lang: uiLang } : fallbackExampleTranslation(w));

    if (exInfo && exInfo.text) {
      var exCfg = LANGS[exInfo.lang] || LANGS.zh;
      el("say-example-en-btn").setAttribute("aria-label", t("aria_say_extrans", { lang: t("lang_name_" + exInfo.lang) }));
      var markInfo = exampleTranslationMarkInfo(exInfo.text, meaningInfo.text, exInfo.lang);
      karaoke.exampleEn = renderKaraoke(el("modal-example-en"), markInfo.text, markInfo.ranges, granularityForLang(exInfo.lang));
      setRtl(el("modal-example-en"), exCfg.rtl);
      el("example-en-wrap").hidden = false;
      currentExampleTranslationText = markInfo.text;
      currentExampleLang = exInfo.lang;
    } else {
      el("example-en-wrap").hidden = true;
      currentExampleTranslationText = "";
      currentExampleLang = meaningInfo.lang;
      karaoke.exampleEn = null;
    }

    el("say-english-btn").hidden = !meaningInfo.text;
    el("say-example-en-btn").hidden = !(exInfo && exInfo.text);
  }

  function refreshModalForLanguage() {
    if (!currentWord) return;
    var w = currentWord;
    stopLoop();
    resetFit();
    renderModalMeaning(w);
    el("say-status").hidden = true;
    el("say-status-example").hidden = true;
    el("say-status-english").hidden = true;
    el("modal-image-wrap").hidden = false;
    buildStrokeBoxes(w.word, w.jyutping, 72);
    fitModal(w);
    setTimeout(startLoop, 350);
  }

  /* ---- Shrink-to-fit: modal never scrolls, so if content is taller than
     the available space we progressively tighten spacing/sizes and, as a
     last resort, hide the picture (least essential part). ---- */
  var FIT_TIERS = [
    { img: 110, gap: 7, exPad: "8px 10px", exFont: 13.5, exFontEn: 12.5, strokeMt: 9, infoMt: 10, canvas: 64, rtlLh: 1.85, hideImage: false, hideStroke: false },
    { img: 60, gap: 6, exPad: "7px 9px", exFont: 13, exFontEn: 12, strokeMt: 8, infoMt: 9, canvas: 58, rtlLh: 1.7, hideImage: false, hideStroke: false },
    { img: 0, gap: 5, exPad: "6px 8px", exFont: 12.5, exFontEn: 11.5, strokeMt: 6, infoMt: 7, canvas: 48, rtlLh: 1.55, hideImage: true, hideStroke: false },
    { img: 0, gap: 4, exPad: "5px 7px", exFont: 12, exFontEn: 11, strokeMt: 4, infoMt: 5, canvas: 40, rtlLh: 1.4, hideImage: true, hideStroke: false },
    { img: 0, gap: 3, exPad: "4px 6px", exFont: 11.5, exFontEn: 10.5, strokeMt: 0, infoMt: 3, canvas: 34, rtlLh: 1.3, hideImage: true, hideStroke: true },
    { img: 0, gap: 2, exPad: "3px 5px", exFont: 11, exFontEn: 10, strokeMt: 0, infoMt: 2, canvas: 30, rtlLh: 1.2, hideImage: true, hideStroke: true }
  ];

  function resetFit() {
    var m = el("modal");
    m.style.removeProperty("--img-h");
    m.style.removeProperty("--gap-panel");
    m.style.removeProperty("--ex-pad");
    m.style.removeProperty("--ex-font");
    m.style.removeProperty("--ex-font-en");
    m.style.removeProperty("--stroke-mt");
    m.style.removeProperty("--info-mt");
    m.style.removeProperty("--rtl-lh");
    el("stroke-panel").hidden = false;
  }

  function applyFitTier(tier) {
    var m = el("modal");
    m.style.setProperty("--img-h", tier.img + "px");
    m.style.setProperty("--gap-panel", tier.gap + "px");
    m.style.setProperty("--ex-pad", tier.exPad);
    m.style.setProperty("--ex-font", tier.exFont + "px");
    m.style.setProperty("--ex-font-en", tier.exFontEn + "px");
    m.style.setProperty("--stroke-mt", tier.strokeMt + "px");
    m.style.setProperty("--info-mt", tier.infoMt + "px");
    m.style.setProperty("--rtl-lh", tier.rtlLh);
    el("stroke-panel").hidden = !!tier.hideStroke;
  }

  function fitModal(w) {
    var m = el("modal");
    var wrapImg = el("modal-image-wrap");
    if (m.scrollHeight <= m.clientHeight + 1) return;
    for (var i = 0; i < FIT_TIERS.length; i++) {
      applyFitTier(FIT_TIERS[i]);
      wrapImg.hidden = FIT_TIERS[i].hideImage;
      if (!FIT_TIERS[i].hideStroke) {
        buildStrokeBoxes(w.word, w.jyutping, FIT_TIERS[i].canvas);
      }
      if (m.scrollHeight <= m.clientHeight + 1) return;
    }
  }

  function openModal(w) {
    currentWord = w;
    lastFocused = document.activeElement;
    resetFit();
    karaoke.word = renderKaraoke(el("modal-word-title"), w.word, [], "char");

    if (w.pos) {
      el("modal-pos").textContent = w.pos;
      el("modal-pos").hidden = false;
    } else {
      el("modal-pos").hidden = true;
    }

    el("modal-jyutping").innerHTML = jyutpingHtml(w.jyutping) || "";
    renderModalMeaning(w);

    el("say-btn").hidden = false;
    el("say-example-btn").hidden = !w.example;
    el("say-status").hidden = true;
    el("say-status-example").hidden = true;
    el("say-status-english").hidden = true;

    var wrapImg = el("modal-image-wrap");
    wrapImg.hidden = false;
    renderModalMedia(w, wrapImg);

    el("scrim").hidden = false;
    document.body.style.overflow = "hidden";

    buildStrokeBoxes(w.word, w.jyutping, 72);
    fitModal(w);

    el("modal-close").focus();

    setTimeout(startLoop, 350);
  }

  function showImageFallback(wrapEl) {
    wrapEl.innerHTML = '<div class="image-fallback">' + t("no_image") + '</div>';
  }

  var VIDEO_EXT_RE = /\.(mp4|webm|mov|m4v)$/i;

  // 每次開新詞語都由頭砌返個圖片/GIF/影片嘅DOM，唔好靠住舊嗰個<img>／<video>
  // 節點一直留喺度——如果上一個詞語冇圖（觸發咗fallback文字），嗰個節點會
  // 俾fallback嘅innerHTML洗咗，跟住嗰個有圖嘅詞語就會搵唔返個元素。
  function renderModalMedia(w, wrapImg) {
    var url = w.image;
    if (!url) {
      showImageFallback(wrapImg);
      return;
    }
    if (VIDEO_EXT_RE.test(url)) {
      wrapImg.innerHTML = '<video id="modal-image" autoplay muted loop playsinline controls></video>';
      var vid = el("modal-image");
      vid.onerror = function () { showImageFallback(wrapImg); };
      vid.src = url;
    } else {
      wrapImg.innerHTML = '<img id="modal-image" alt="">';
      var img = el("modal-image");
      img.onerror = function () { showImageFallback(wrapImg); };
      img.src = url;
      img.alt = t("alt_word", { w: w.word });
    }
  }

  function closeModal() {
    stopLoop();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (activeClipAudio) { try { activeClipAudio.pause(); } catch (e) {} activeClipAudio = null; }
    stopClipKaraoke();
    el("scrim").hidden = true;
    document.body.style.overflow = "";
    cleanupWriters();
    currentWord = null;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  el("modal-close").addEventListener("click", closeModal);
  el("scrim").addEventListener("click", function (e) {
    if (e.target === el("scrim")) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !el("scrim").hidden) closeModal();
  });
  el("replay-btn").addEventListener("click", startLoop);

  /* ---------------- Pronunciation ---------------- */

  var cachedVoices = [];
  function refreshVoices() {
    cachedVoices = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
  }
  if ("speechSynthesis" in window) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = refreshVoices;
  }

  function pickCantoneseVoice() {
    return cachedVoices.find(function (v) { return /^zh-HK/i.test(v.lang) || /yue/i.test(v.lang); }) ||
      cachedVoices.find(function (v) { return /^zh/i.test(v.lang); }) ||
      null;
  }

  var LANGS = {
    zh: { label: "中文", dispName: "中文", labelMeaning: "中文意思", rtl: false,
          tts: { tag: "zh-HK", prefix: /^zh/i, preferred: /^zh-HK/i, rate: 0.85 } },
    en: { label: "EN", dispName: "英文", labelMeaning: "英文意思", rtl: false,
          tts: { tag: "en-US", prefix: /^en/i, preferred: /^en-US/i, rate: 0.9 } },
    ko: { label: "한국어", dispName: "韓文", labelMeaning: "韓文意思", rtl: false,
          tts: { tag: "ko-KR", prefix: /^ko/i, preferred: /^ko-KR/i, rate: 0.85 } },
    ur: { label: "اردو", dispName: "烏都文", labelMeaning: "烏都文意思", rtl: true,
          tts: { tag: "ur-PK", prefix: /^ur/i, preferred: /^ur-PK/i, rate: 0.85 } }
  };

  function pickVoiceForLang(prefix, preferred) {
    if (preferred) {
      var pv = cachedVoices.find(function (v) { return preferred.test(v.lang); });
      if (pv) return pv;
    }
    return cachedVoices.find(function (v) { return prefix.test(v.lang); }) || null;
  }

  // 裝置搵唔到某種語言嘅朗讀聲音時，畀返實際可以點做嘅步驟（唔同裝置設定位置唔同）
  function platformHint() {
    var ua = navigator.userAgent || "";
    var platform = navigator.platform || "";
    if (/iPhone|iPad|iPod/i.test(ua)) {
      return t("hint_ios");
    }
    if (/Android/i.test(ua)) {
      return t("hint_android");
    }
    if (/Mac/i.test(platform) || /Macintosh/i.test(ua)) {
      return t("hint_mac");
    }
    if (/Win/i.test(platform) || /Windows/i.test(ua)) {
      return t("hint_win");
    }
    return t("hint_other");
  }

  function setStatus(statusEl, text) {
    if (text) {
      statusEl.textContent = text;
      statusEl.hidden = false;
      refitModalIfNeeded(); // 提示文字有時會令個modal變高，即刻check多次確保仍然唔使scroll
    } else {
      statusEl.textContent = "";
      statusEl.hidden = true;
    }
  }

  function refitModalIfNeeded() {
    if (!currentWord) return;
    var w = currentWord;
    requestAnimationFrame(function () {
      var m = el("modal");
      if (m && m.scrollHeight > m.clientHeight + 1) {
        resetFit();
        buildStrokeBoxes(w.word, w.jyutping, 72);
        fitModal(w);
      }
    });
  }

  // 幫TTS嘅utterance掛返karaoke跟色事件：onboundary通常會逐個詞報返讀到
  // 邊個字元（charIndex），用嚟即時update；唔係每個瀏覽器/聲音都支援
  // onboundary（例如部分手機），所以一定要有onend/onerror做保險，確保
  // 就算冇一個word boundary事件都好，播完最少都會著晒色，唔會一直半桶水。
  function attachKaraoke(utterance, spans) {
    if (!spans) return;
    karaokeReset(spans);
    utterance.onboundary = function (e) {
      if (typeof e.charIndex === "number") karaokeSetProgress(spans, e.charIndex);
    };
    utterance.onend = function () { karaokeComplete(spans); };
    utterance.onerror = function () { karaokeComplete(spans); };
  }

  function speakText(text, statusEl, spans) {
    if (!("speechSynthesis" in window)) {
      setStatus(statusEl, t("tts_unsupported"));
      return;
    }
    refreshVoices(); // 手機嘅語音清單有時遲啲先載好，撳掣嗰刻重新check一次先準確
    var voice = pickCantoneseVoice();
    setStatus(statusEl, voice && /^zh-HK/i.test(voice.lang) ? "" : t("tts_no_canto"));
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK";
    if (voice) u.voice = voice;
    u.rate = 0.85;
    attachKaraoke(u, spans);
    speechSynthesis.speak(u);
  }

  function speakGloss(text, langKey, statusEl, spans) {
    var langCfg = LANGS[langKey] || LANGS.zh;
    var cfg = langCfg.tts;
    if (!("speechSynthesis" in window)) {
      if (statusEl) setStatus(statusEl, t("tts_unsupported"));
      return;
    }
    refreshVoices();
    var voice = pickVoiceForLang(cfg.prefix, cfg.preferred);
    // 英文喺絕大部分裝置都穩定有得讀，唔使特登提示；其他語言就唔一定人人部機都有，搵唔到先提示
    if (statusEl) setStatus(statusEl, (!voice && langKey !== "en") ? (t("tts_no_voice", { lang: t("lang_name_" + langKey) }) + platformHint()) : "");
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = cfg.tag;
    if (voice) u.voice = voice;
    u.rate = cfg.rate;
    attachKaraoke(u, spans);
    speechSynthesis.speak(u);
  }

  // 粵語拼音 -> 錄音檔slug（同批量生成錄音嗰個script用緊嘅規則一致）。
  function jyutpingSlug(jyutping) {
    return (jyutping || "").replace(/\s+/g, "").replace(/[^A-Za-z0-9]/g, "");
  }

  // 撳咗🔊掣之後，如果要等錄音檔從網絡load返嚟，就show返個轉圈圈遮罩，
  // 同時擋晒成個畫面唔俾人撳其他嘢，等用戶知道仲未播到、唔好以為冇反應。
  // 用token機制：如果用戶手快連續撳幾下，淨係最新嗰次先有權收返個遮罩，
  // 咁就唔會俾舊嗰次嘅完成事件搶住收咗、but個新請求其實都仲未load完。
  var audioLoadToken = 0;
  function showAudioLoading() {
    audioLoadToken++;
    var token = audioLoadToken;
    var overlay = el("audio-loading-overlay");
    if (overlay) overlay.hidden = false;
    // 保險網：萬一啲事件（playing/error）冇一個觸發到（好罕見），都唔好一直擋住個畫面
    setTimeout(function () { hideAudioLoading(token); }, 6000);
    return token;
  }
  function hideAudioLoading(token) {
    if (token !== audioLoadToken) return;
    var overlay = el("audio-loading-overlay");
    if (overlay) overlay.hidden = true;
  }

  // batch生成嘅錄音打包做兩層：每個詞語嘅所有句子先合併做一個mp3，再將
  // 同一課嘅詞語全部埋一齊變做一個「課次bundle」（audio/bundles/L###.mp3）——
  // 因為一個artifact最多得幾百個檔案，1500幾個詞語就算每個詞語得一個檔案都
  // 放唔晒，而按課次打包仲啱好夾晒學生「開一課溫一課」嘅瀏覽方式：開嗰課
  // 一次過下載晒個bundle，之後同一課入面揀邊個詞語都唔使再攞新檔案。
  // manifest.json 記低每個詞語屬於邊個bundle，同埋每一句喺個bundle入面嘅
  // 開始時間同長度，播嘅時候seek過去嗰段。
  var activeClipAudio = null;
  var activeClipRaf = null;
  function stopClipKaraoke() {
    if (activeClipRaf) { cancelAnimationFrame(activeClipRaf); activeClipRaf = null; }
  }

  // 有啲錄音（用generate_audio.py新版生成嘅）帶埋逐字時間標記（marks），
  // 格式係 [[字元位置, 幾多秒開始], ...]，由生成錄音嗰陣Microsoft TTS
  // 自己吐返嚟嘅WordBoundary事件計出嚟，所以幾時highlight到邊個字都好準；
  // 冇嘅（例如仲未重新生成過嘅舊錄音）就退返用「播咗幾多秒/成段幾長」嘅
  // 比例粗略估計，唔會100%貼準，但好過完全冇跟色。
  //
  // TTS有時會將幾個中文字一齊當一個「detection unit」報一個WordBoundary
  // （例如「每天」兩個字得返一個mark），如果照直用就會嗰兩個字一齊跳出嚟，
  // 而唔係一個跟住一個咁着色。呢度將「呢個mark到下一個mark之間嗰段時間」
  // 平均攤分落佢涵蓋嘅每一個字度，估計返每個字自己嘅開始時間，等中文都
  // 可以做到真正逐字（而唔係逐個detection unit）咁跟色。
  //
  // 最尾一個mark冇「下一個mark」可以攤分（成句嘢讀晒之後就冇再有boundary
  // 事件）。第一版諗住用「成段clip嘅實際長度」（duration）當終點，但實測
  // 發現好多錄音喺最尾一個字讀完之後，其實仲拖多咗一截靜音／停頓先至真正
  // 結束（平均成0.79秒，有啲仲成1.2秒以上），如果照用duration做終點，個
  // 攤分就會將呢截靜音都計埋落最尾幾個字度，害到佢哋著色比實際讀音慢咗
  // 成成半秒甚至更耐——呢個先係「最尾幾個字成日都有延遲」嘅真正原因。
  //
  // 修法：唔靠duration，改用返呢個clip自己前面已經量到嘅語速（其他有真正
  // 「下一個mark」夾住嘅組別，平均每個字要幾多秒）嚟推算最尾呢組大約會
  // 喺幾時讀完，先合理咁貼近實際讀音；淨係喺完全冇語速資料可以參考嗰陣
  // （好罕見）先退返去用duration做保險。
  // 攞返一組marks入面「有真正下一個mark夾住」嘅組別，計返平均每個字要幾多
  // 秒——呢個就係呢段錄音（呢個講者、呢個語速）大約嘅「語速」，其他函數
  // 攞嚟推算冇足夠marks資料嗰啲位置大約幾時先讀完。
  function estimatePaceFromMarks(marks) {
    if (!marks || marks.length < 2) return null;
    var paceTime = 0, paceChars = 0;
    for (var j = 0; j < marks.length - 1; j++) {
      var dt = marks[j + 1][1] - marks[j][1];
      var dc = marks[j + 1][0] - marks[j][0];
      if (dc > 0 && dt > 0) { paceTime += dt; paceChars += dc; }
    }
    return paceChars > 0 ? (paceTime / paceChars) : null;
  }

  function expandMarksPerChar(marks, totalLen, duration) {
    if (!marks || marks.length < 2) return marks;

    var avgSecPerChar = estimatePaceFromMarks(marks);

    var expanded = [];
    for (var i = 0; i < marks.length; i++) {
      var startIdx = marks[i][0];
      var startTime = marks[i][1];
      var isLast = i === marks.length - 1;
      var endIdx = isLast ? totalLen : marks[i + 1][0];
      var span = endIdx - startIdx;
      var endTime;
      if (!isLast) {
        endTime = marks[i + 1][1];
      } else if (avgSecPerChar != null) {
        endTime = startTime + avgSecPerChar * span;
        if (!(endTime > startTime) || endTime > duration) endTime = duration;
      } else {
        endTime = duration;
      }
      if (span <= 1 || !(endTime > startTime)) {
        expanded.push([startIdx, startTime]);
      } else {
        for (var c = 0; c < span; c++) {
          expanded.push([startIdx + c, startTime + (endTime - startTime) * (c / span)]);
        }
      }
      // 最尾一組冇「下一個mark」嚟話畀karaokeSetProgress聽「呢組字讀完喇」，
      // 結果就算逐個字咁攤分咗開始時間，個組入面最後嗰一個字都因為冇更後
      // 嘅mark去反映佢「讀完」，永遠都要等到karaokeComplete（成段clip完全
      // 播完，即係連埋尾巴嗰截靜音）先至著色——即係話唔理點攤分，最尾一個
      // 字實際上都係跟住成段clip嘅duration嚟著色，唔係跟返估計嘅讀音時間。
      // 所以呢度加多一個「終點」標記（[totalLen, endTime]），等最尾一個字
      // 都可以喺估計佢讀完嗰一刻（而唔係成段clip完全播完嗰一刻）就著色。
      if (isLast) {
        expanded.push([endIdx, endTime]);
      }
    }
    return expanded;
  }

  function charIndexFromMarks(marks, elapsed) {
    var idx = 0;
    for (var i = 0; i < marks.length; i++) {
      if (marks[i][1] <= elapsed) idx = marks[i][0];
      else break;
    }
    return idx;
  }

  // 好短嘅clip（例如淨係得個詞語本身，得2-4個字）成日會俾TTS當成一個
  // 整體，得返0-1個mark，唔夠資料做逐字marks-driven highlight，要退返
  // 用「比例估計」。但如果純粹用「播咗幾多秒 / 成段clip幾長」嚟做比例，
  // 個clip自己個duration好多時都包埋讀完之後嗰截尾巴靜音（同expandMarksPerChar
  // 上面段註解講嗰個問題一樣），比例估計會愈估愈慢，成個詞都會覺得慢咗
  // 先著色。呢度嘅refPace係嚟自呢個詞語「例句」clip（幾乎100%都有齊足夠
  // marks）量到嘅語速，攞嚟推算呢個短clip大概幾多秒先讀完（而唔係盲目
  // 用成段duration），令到冇精準marks嘅短word clip都可以估得準啲。
  function runClipKaraoke(audio, duration, spans, totalLen, marks, refPace, rate) {
    if (!spans || !totalLen) return;
    karaokeReset(spans);
    // audio.currentTime唔會即刻準確反映一個深入大檔案嘅seek位置，
    // 所以改用「由playing事件觸發嗰刻開始計」嘅牆鐘時間嚟計算進度，
    // 同schedulePause() 一直以嚟嘅計時假設一致（marks嘅時間座標都係跟返
    // 呢個「由clip自己開始計」嘅假設）。
    var playStart = performance.now();
    // 淨係得一個mark（成段嘢畀TTS當一個整體，冇再拆開），charIndex會由頭到尾
    // 都停響同一個位置，跟色會「卡住－然後成句一齊跳晒」，仲差過粗略估計，
    // 所以呢種情況照舊退返用比例估計，要至少兩個mark先當有意義嘅精準資料。
    var hasMarks = marks && marks.length > 1;
    var expandedMarks = hasMarks ? expandMarksPerChar(marks, totalLen, duration) : null;

    // 比例估計用嘅「終點」：有得參考語速就用「開始offset + 語速×字數」估計，
    // 冇（好罕見）先退返用成段duration。
    var fallbackStart = (!hasMarks && marks && marks.length) ? marks[0][1] : 0;
    var fallbackEnd = duration;
    if (!hasMarks && refPace != null) {
      var est = fallbackStart + refPace * totalLen;
      if (est > fallbackStart && est <= duration) fallbackEnd = est;
    }

    function tick() {
      if (activeClipAudio !== audio) return;
      var elapsed = (performance.now() - playStart) / 1000 * (rate || 1);
      if (hasMarks) {
        karaokeSetProgress(spans, charIndexFromMarks(expandedMarks, elapsed));
      } else if (fallbackEnd > fallbackStart) {
        var frac = Math.min(1, Math.max(0, (elapsed - fallbackStart) / (fallbackEnd - fallbackStart)));
        karaokeSetProgress(spans, Math.round(frac * totalLen));
      } else {
        var frac2 = duration > 0 ? Math.min(1, Math.max(0, elapsed / duration)) : 1;
        karaokeSetProgress(spans, Math.round(frac2 * totalLen));
      }
      if (elapsed < duration) {
        activeClipRaf = requestAnimationFrame(tick);
      } else {
        karaokeComplete(spans);
      }
    }
    activeClipRaf = requestAnimationFrame(tick);
  }

  function playClip(slug, clipKey, fallbackFn, spans, totalLen) {
    var wordEntry = audioManifest && audioManifest[slug];
    var entry = wordEntry && wordEntry.clips && wordEntry.clips[clipKey];
    if (!entry || !wordEntry.bundle) { fallbackFn(); return; }
    // 呢個clip自己（例如成日淨係得幾個字嘅「詞語」clip）如果得返0-1個mark，
    // 就借返呢個詞語「例句」clip量到嘅語速（幾乎一定有齊足夠marks）嚟推算
    // 比例估計嘅終點，好過盲目跟成段duration（詳見runClipKaraoke嘅註解）。
    var hasOwnMarks = entry.marks && entry.marks.length > 1;
    var refClip = !hasOwnMarks && wordEntry.clips && clipKey !== "example" ? wordEntry.clips.example : null;
    var refPace = refClip ? estimatePaceFromMarks(refClip.marks) : null;
    if (activeClipAudio) {
      try { activeClipAudio.pause(); } catch (e) {}
      activeClipAudio = null;
    }
    stopClipKaraoke();
    var loadToken = showAudioLoading();
    var audio = new Audio("audio/bundles/" + wordEntry.bundle + ".mp3");
    activeClipAudio = audio;
    var start = entry.start;
    var started = false;
    // 用timeupdate嚟判斷幾時停係唔準嘅：個事件通常每250毫秒先至觸發一次，
    // 一停慢咗就會漏咗少少下一段錄音出嚟，聽落好似播完之後多咗一下怪聲。
    // 改用setTimeout（喺真正開始播嗰刻先計時），準確好多，仲刻意早少少停，
    // 確保唔會播埋去下一段嘅開頭。
    function schedulePause() {
      var stopMs = Math.max(0, entry.duration * 1000 - 60);
      setTimeout(function () {
        if (activeClipAudio === audio) {
          try { audio.pause(); } catch (e) {}
          stopClipKaraoke();
          karaokeComplete(spans);
        }
      }, stopMs);
    }
    function begin() {
      if (started) return;
      started = true;
      // 如果載入嘅期間用戶已經撳咗下一個／關咗畫面，呢段錄音就唔好再播
      if (activeClipAudio !== audio) { hideAudioLoading(loadToken); return; }
      try { audio.currentTime = start; } catch (e) {}
      audio.addEventListener("playing", function () { hideAudioLoading(loadToken); }, { once: true });
      audio.addEventListener("playing", schedulePause, { once: true });
      audio.addEventListener("playing", function () { runClipKaraoke(audio, entry.duration, spans, totalLen, entry.marks, refPace); }, { once: true });
      audio.play().catch(function () { hideAudioLoading(loadToken); fallbackFn(); });
    }
    audio.addEventListener("error", function () { hideAudioLoading(loadToken); fallbackFn(); });
    if (audio.readyState >= 1) {
      begin();
    } else {
      audio.addEventListener("loadedmetadata", begin);
    }
  }

  // 優先播老師手動指定嘅錄音檔（如果有），搵唔到就play合併錄音入面嗰一段，
  // 兩樣都搵唔到（例如老師仲未做呢個功能）先至用返裝置內置朗讀頂住。
  function playWithFallbacks(explicitPath, slug, clipKey, ttsFn, spans, totalLen) {
    function tryClip() { playClip(slug, clipKey, ttsFn, spans, totalLen); }
    if (explicitPath) {
      var loadToken = showAudioLoading();
      var audio = new Audio(explicitPath);
      var moved = false;
      function next() { if (moved) return; moved = true; hideAudioLoading(loadToken); tryClip(); }
      audio.addEventListener("error", next);
      audio.addEventListener("playing", function () {
        hideAudioLoading(loadToken);
        if (spans && totalLen) {
          activeClipAudio = audio;
          karaokeReset(spans);
          audio.addEventListener("timeupdate", function () {
            if (activeClipAudio !== audio || !audio.duration) return;
            karaokeSetProgress(spans, Math.round(Math.min(1, audio.currentTime / audio.duration) * totalLen));
          });
          audio.addEventListener("ended", function () { karaokeComplete(spans); }, { once: true });
        }
      }, { once: true });
      audio.play().catch(next);
    } else {
      tryClip();
    }
  }
