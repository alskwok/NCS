  /* ---------------- 加到主畫面（PWA安裝） ----------------
     Android／桌面Chrome呢類支援 beforeinstallprompt 嘅瀏覽器，撳掣會直接
     彈出瀏覽器原生嘅安裝提示；iOS Safari同其他唔支援呢個API嘅瀏覽器，
     冇辦法用程式自動觸發安裝（呢個係iOS本身嘅限制，網站做唔到），
     所以退返用一個簡單教學（分享→加入主畫面）畀學生跟住做。 ---- */
  (function () {
    var installBtn = el("install-btn");
    var installScrim = el("install-scrim");
    var installStepsEl = el("install-steps");
    var deferredPrompt = null;

    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isStandalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true;

    // 已經加咗落主畫面、用緊「App模式」開緊嘅話，就唔使再show呢個掣。
    if (!isStandalone) installBtn.hidden = false;

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    function installStepsHtml() {
      if (isIOS) {
        return [
          t("install_ios_1"),
          t("install_ios_2"),
          t("install_ios_3")
        ];
      }
      return [
        t("install_other_1"),
        t("install_other_2"),
        t("install_other_3")
      ];
    }

    function openInstallInstructions() {
      installStepsEl.innerHTML = installStepsHtml().map(function (s) { return "<li>" + s + "</li>"; }).join("");
      installScrim.hidden = false;
    }
    function closeInstallInstructions() { installScrim.hidden = true; }

    installBtn.addEventListener("click", function () {
      if (deferredPrompt) {
        var promptEvent = deferredPrompt;
        deferredPrompt = null;
        promptEvent.prompt();
      } else {
        openInstallInstructions();
      }
    });

    el("install-modal-close").addEventListener("click", closeInstallInstructions);
    installScrim.addEventListener("click", function (e) { if (e.target === installScrim) closeInstallInstructions(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !installScrim.hidden) closeInstallInstructions(); });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  })();

  /* ---------------- 朗讀默書 ---------------- */
  // 流程：揀年級／課本 → 剔課次（成課）或者展開再揀個別詞語 → 開始默書。
  // 詞語次序隨機，一次讀一個，要學生自己撳「下一個」先會讀下一個；
  // 最後一個撳完就顯示「默書已經結束，請自己檢查」。
  (function () {
    var dict = { grade: null, book: null, sel: {}, expanded: {}, queue: [], idx: 0,
                 lastNextAt: 0, mode: "setup", gen: 0 };
    var scrim = el("dict-scrim");

    function shuffle(a) {
      var r = a.slice();
      for (var i = r.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = r[i]; r[i] = r[j]; r[j] = t;
      }
      return r;
    }

    function stopAllAudio() {
      dict.gen++; // 令仲未播嘅TTS後備唔會遲啲先彈出嚟
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      if (activeClipAudio) { try { activeClipAudio.pause(); } catch (e) {} activeClipAudio = null; }
      stopClipKaraoke();
      audioLoadToken++;
      var ov = el("audio-loading-overlay");
      if (ov) ov.hidden = true;
    }

    function showMode(m) {
      dict.mode = m;
      el("dict-modal").setAttribute("data-mode", m);
      el("dict-setup").hidden = m !== "setup";
      el("dict-foot").hidden = m !== "setup";
      el("dict-play").hidden = m !== "play";
      el("dict-done").hidden = m !== "done";
      el("dict-sub").textContent =
        m === "setup" ? t("dict_sub_setup") :
        m === "play" ? t("dict_sub_play") : t("dict_sub_done");
      setStatus(el("dict-status"), "");
      el("dict-body").scrollTop = 0;
    }

    /* ----- 揀詞語畫面 ----- */

    function chip(label, active, onClick, cls) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dict-chip" + (cls ? " " + cls : "");
      b.textContent = label;
      b.setAttribute("aria-pressed", active ? "true" : "false");
      b.addEventListener("click", onClick);
      return b;
    }

    function selCount(key) { return dict.sel[key] ? Object.keys(dict.sel[key]).length : 0; }

    function collectSelected() {
      var seen = {}, out = [];
      Object.keys(dict.sel).forEach(function (key) {
        var words = DATA.words[key] || [];
        Object.keys(dict.sel[key]).map(Number).sort(function (a, b) { return a - b; }).forEach(function (i) {
          var w = words[i];
          if (w && !seen[w.word]) { seen[w.word] = true; out.push(w); }
        });
      });
      return out;
    }

    function updateFooter() {
      var n = collectSelected().length;
      el("dict-count").innerHTML = n ? t("dict_count_n", { n: n }) : t("dict_count_0");
      el("dict-start").disabled = n === 0;
    }

    function buildLessonRow(ls) {
      var key = wordKey(dict.grade, dict.book, ls);
      var words = DATA.words[key] || [];
      var row = document.createElement("div");
      row.className = "dict-lesson";

      var head = document.createElement("div");
      head.className = "dict-lesson-head";
      var check = document.createElement("button");
      check.type = "button";
      check.className = "dict-check";
      check.setAttribute("role", "checkbox");
      check.setAttribute("aria-label", t("dict_check_aria", { name: ls }));
      check.innerHTML = '<span class="dict-check-box"></span>';
      var name = document.createElement("button");
      name.type = "button";
      name.className = "dict-lesson-name";
      var title = document.createElement("span");
      title.className = "dict-lesson-title";
      title.textContent = ls;
      var count = document.createElement("span");
      count.className = "dict-lesson-count";
      name.appendChild(title);
      name.appendChild(count);
      var expand = document.createElement("button");
      expand.type = "button";
      expand.className = "dict-expand";
      head.appendChild(check);
      head.appendChild(name);
      head.appendChild(expand);
      row.appendChild(head);

      var wordsBox = null, chipEls = [];

      function refresh() {
        var n = selCount(key);
        check.setAttribute("aria-checked", n === 0 ? "false" : (n === words.length ? "true" : "mixed"));
        count.textContent = n ? t("dict_lesson_sel", { n: n, t: words.length }) : t("words_count", { n: words.length });
        count.className = "dict-lesson-count" + (n ? " has" : "");
        chipEls.forEach(function (c, i) {
          c.setAttribute("aria-pressed", dict.sel[key] && dict.sel[key][i] ? "true" : "false");
        });
        var open = !!dict.expanded[key];
        expand.textContent = open ? t("dict_collapse") : t("dict_expand");
        expand.setAttribute("aria-expanded", open ? "true" : "false");
      }

      function toggleAll() {
        if (selCount(key) === words.length) delete dict.sel[key];
        else { dict.sel[key] = {}; words.forEach(function (w, i) { dict.sel[key][i] = true; }); }
        refresh(); updateFooter();
      }

      function buildWords() {
        wordsBox = document.createElement("div");
        wordsBox.className = "dict-lesson-words";
        var chips = document.createElement("div");
        chips.className = "dict-chips";
        words.forEach(function (w, i) {
          var c = chip(w.word, false, function () {
            if (!dict.sel[key]) dict.sel[key] = {};
            if (dict.sel[key][i]) { delete dict.sel[key][i]; if (!selCount(key)) delete dict.sel[key]; }
            else dict.sel[key][i] = true;
            refresh(); updateFooter();
          }, "dict-chip--word");
          chipEls.push(c);
          chips.appendChild(c);
        });
        wordsBox.appendChild(chips);
        row.appendChild(wordsBox);
      }

      function setOpen(open) {
        dict.expanded[key] = open;
        if (open && !wordsBox) buildWords();
        if (wordsBox) wordsBox.hidden = !open;
        refresh();
      }

      if (!words.length) {
        check.disabled = true; name.disabled = true; expand.hidden = true;
        count.textContent = t("dict_no_words");
      } else {
        check.addEventListener("click", toggleAll);
        name.addEventListener("click", toggleAll);
        expand.addEventListener("click", function () { setOpen(!dict.expanded[key]); });
      }
      if (dict.expanded[key]) setOpen(true); else refresh();
      return row;
    }

    function bulkBook(on) {
      var lessons = DATA.structure[dict.grade].lessons[dict.book] || [];
      lessons.forEach(function (ls) {
        var key = wordKey(dict.grade, dict.book, ls);
        var words = DATA.words[key] || [];
        if (on && words.length) { dict.sel[key] = {}; words.forEach(function (w, i) { dict.sel[key][i] = true; }); }
        else delete dict.sel[key];
      });
      var top = el("dict-body").scrollTop;
      renderSetup();
      el("dict-body").scrollTop = top;
    }

    function renderSetup() {
      var box = el("dict-setup");
      box.innerHTML = "";
      var lbl = document.createElement("div");
      lbl.className = "dict-label"; lbl.textContent = t("dict_grade");
      box.appendChild(lbl);
      var gr = document.createElement("div");
      gr.className = "dict-chips";
      DATA.grades.forEach(function (g) {
        gr.appendChild(chip(g, g === dict.grade, function () {
          dict.grade = g;
          dict.book = DATA.structure[g].books[0];
          renderSetup();
        }));
      });
      box.appendChild(gr);

      var lbl2 = document.createElement("div");
      lbl2.className = "dict-label"; lbl2.textContent = t("dict_book");
      box.appendChild(lbl2);
      var bk = document.createElement("div");
      bk.className = "dict-chips";
      DATA.structure[dict.grade].books.forEach(function (b) {
        bk.appendChild(chip(b, b === dict.book, function () { dict.book = b; renderSetup(); }));
      });
      box.appendChild(bk);

      var bar = document.createElement("div");
      bar.className = "dict-toolbar";
      var l3 = document.createElement("div");
      l3.className = "dict-label"; l3.textContent = t("dict_lessons");
      var all = document.createElement("button");
      all.type = "button"; all.className = "dict-link"; all.textContent = t("dict_all_book");
      all.addEventListener("click", function () { bulkBook(true); });
      var none = document.createElement("button");
      none.type = "button"; none.className = "dict-link"; none.textContent = t("dict_clear_book");
      none.addEventListener("click", function () { bulkBook(false); });
      bar.appendChild(l3); bar.appendChild(all); bar.appendChild(none);
      box.appendChild(bar);

      (DATA.structure[dict.grade].lessons[dict.book] || []).forEach(function (ls) {
        box.appendChild(buildLessonRow(ls));
      });

      var tip = document.createElement("p");
      tip.className = "empty-note";
      tip.textContent = t("dict_tip");
      box.appendChild(tip);
      updateFooter();
    }

    /* ----- 開關 ----- */

    function openDict() {
      if (!DATA) return;
      if (!dict.grade || !DATA.structure[dict.grade]) dict.grade = state.grade || DATA.grades[0];
      var books = DATA.structure[dict.grade].books;
      if (!dict.book || books.indexOf(dict.book) < 0) {
        dict.book = (state.grade === dict.grade && state.book && books.indexOf(state.book) >= 0) ? state.book : books[0];
      }
      lastFocusedBeforeDict = document.activeElement;
      showMode("setup");
      renderSetup();
      scrim.hidden = false;
      document.body.style.overflow = "hidden";
      el("dict-close").focus();
    }
    var lastFocusedBeforeDict = null;

    function closeDict() {
      stopAllAudio();
      scrim.hidden = true;
      document.body.style.overflow = "";
      if (lastFocusedBeforeDict && lastFocusedBeforeDict.focus) lastFocusedBeforeDict.focus();
    }

    // 默緊書嗰陣撳×／Esc／退出：唔好一撳就走，行內問多一次，免得手滑冇咗進度。
    function requestExit() {
      if (dict.mode !== "play") { closeDict(); return; }
      var row = el("dict-exit-row");
      row.innerHTML = '<span>' + t("dict_exit_confirm") + '</span>' +
        '<button type="button" class="dict-link" id="dict-exit-yes">' + t("dict_exit_yes") + '</button>' +
        '<button type="button" class="dict-link" id="dict-exit-no">' + t("dict_exit_no") + '</button>';
      el("dict-exit-yes").addEventListener("click", closeDict);
      el("dict-exit-no").addEventListener("click", resetExitRow);
      el("dict-exit-no").focus();
    }
    function resetExitRow() {
      el("dict-exit-row").innerHTML = '<button type="button" class="dict-link" id="dict-exit">' + t("dict_exit") + '</button>';
      el("dict-exit").addEventListener("click", requestExit);
    }

    /* ----- 默書 ----- */

    function playWord(w, kind) {
      var gen = ++dict.gen;
      var statusEl = el("dict-status");
      setStatus(statusEl, "");
      function guard(fn) { return function () { if (dict.gen === gen && !scrim.hidden) fn(); }; }
      var slug = w.audioId || jyutpingSlug(w.jyutping);
      if (kind === "example" && w.example) {
        playWithFallbacks(w.exampleAudio, slug, "example",
          guard(function () { speakText(w.example, statusEl, null); }), null, 0);
      } else {
        playWithFallbacks(w.audio, slug, "word",
          guard(function () { speakText(w.word, statusEl, null); }), null, 0);
      }
    }

    function renderItem() {
      var total = dict.queue.length;
      var w = dict.queue[dict.idx];
      el("dict-progress-text").innerHTML = t("dict_progress", { i: dict.idx + 1, n: total });
      el("dict-bar-fill").style.width = (dict.idx / total * 100) + "%";
      el("dict-example").hidden = !w.example;
      el("dict-next").textContent = dict.idx === total - 1 ? t("dict_finish") : t("dict_next");
      resetExitRow();
    }

    function startDictation() {
      var list = collectSelected();
      if (!list.length) return;
      stopAllAudio();
      dict.queue = shuffle(list);
      dict.idx = 0;
      dict.lastNextAt = Date.now();
      showMode("play");
      renderItem();
      playWord(dict.queue[0], "word");
      el("dict-next").focus();
    }

    function nextItem() {
      if (dict.mode !== "play") return;
      var now = Date.now();
      if (now - dict.lastNextAt < 450) return; // 防止連撳兩下跳咗一個
      dict.lastNextAt = now;
      if (dict.idx >= dict.queue.length - 1) { finishDictation(); return; }
      dict.idx++;
      renderItem();
      playWord(dict.queue[dict.idx], "word");
    }

    // 完結提示用語音讀出嚟：中文介面優先播audio/dictation_end.mp3（同其他詞語
    // 一樣用generate_audio.py嗰個粵語聲音生成），英文介面優先播
    // audio/dictation_end_en.mp3；冇呢個檔或者播唔到，就用裝置內置朗讀頂住
    // （中文＝粵語，英文＝英文聲）。
    function speakEnd() {
      stopAllAudio();
      var gen = dict.gen;
      var statusEl = el("dict-status");
      var en = siteLang === "en";
      var text = t("dict_end_speech");
      var fell = false;
      function fallback() {
        if (fell || dict.gen !== gen || scrim.hidden) return;
        fell = true;
        if (en) speakGloss(text, "en", statusEl, null); else speakText(text, statusEl, null);
      }
      var audio = new Audio(en ? "audio/dictation_end_en.mp3" : "audio/dictation_end.mp3");
      activeClipAudio = audio;
      audio.addEventListener("error", fallback);
      audio.play().catch(fallback);
    }

    function finishDictation() {
      stopAllAudio();
      var n = dict.queue.length;
      el("dict-bar-fill").style.width = "100%";
      el("dict-reminder").textContent = t("dict_reminder", { n: n });
      el("dict-answers").hidden = true;
      el("dict-answers").innerHTML = "";
      el("dict-show-answers").textContent = t("dict_show_answers");
      el("dict-show-answers").setAttribute("aria-expanded", "false");
      showMode("done");
      el("dict-show-answers").focus();
      speakEnd();
    }

    function toggleAnswers() {
      var box = el("dict-answers");
      var open = box.hidden;
      if (open && !box.childNodes.length) {
        dict.queue.forEach(function (w, i) {
          var r = document.createElement("div");
          r.className = "dict-answer";
          var no = document.createElement("span"); no.className = "dict-answer-no"; no.textContent = (i + 1) + ".";
          var wd = document.createElement("span"); wd.className = "dict-answer-word"; wd.textContent = w.word;
          var jp = document.createElement("span"); jp.className = "dict-answer-jp"; jp.textContent = w.jyutping || "";
          var sb = document.createElement("button");
          sb.type = "button"; sb.className = "say-btn say-btn--sm"; sb.textContent = "🔊";
          sb.setAttribute("aria-label", t("dict_play_aria", { w: w.word }));
          sb.addEventListener("click", function () { playWord(w, "word"); });
          r.appendChild(no); r.appendChild(wd); r.appendChild(jp); r.appendChild(sb);
          box.appendChild(r);
        });
      }
      box.hidden = !open;
      el("dict-show-answers").textContent = open ? t("dict_hide_answers") : t("dict_show_answers");
      el("dict-show-answers").setAttribute("aria-expanded", open ? "true" : "false");
      if (open) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    /* ----- 事件 ----- */

    el("dict-open").addEventListener("click", openDict);
    el("dict-close").addEventListener("click", requestExit);
    scrim.addEventListener("click", function (e) { if (e.target === scrim) requestExit(); });
    el("dict-start").addEventListener("click", startDictation);
    el("dict-replay").addEventListener("click", function () {
      if (dict.mode === "play") playWord(dict.queue[dict.idx], "word");
    });
    el("dict-example").addEventListener("click", function () {
      if (dict.mode === "play") playWord(dict.queue[dict.idx], "example");
    });
    el("dict-next").addEventListener("click", nextItem);
    el("dict-exit").addEventListener("click", requestExit);
    el("dict-show-answers").addEventListener("click", toggleAnswers);
    el("dict-end-say").addEventListener("click", speakEnd);
    el("dict-again").addEventListener("click", function () {
      stopAllAudio();
      dict.queue = shuffle(dict.queue);
      dict.idx = 0;
      dict.lastNextAt = Date.now();
      showMode("play");
      renderItem();
      playWord(dict.queue[0], "word");
      el("dict-next").focus();
    });
    el("dict-back").addEventListener("click", function () {
      stopAllAudio();
      showMode("setup");
      renderSetup();
    });
    document.addEventListener("keydown", function (e) {
      if (scrim.hidden) return;
      if (e.key === "Escape") { requestExit(); return; }
      if (dict.mode === "play" && e.key === "ArrowRight") { e.preventDefault(); nextItem(); }
    });
  })();


  /* ---------------- 課文錄音播放（課文朗讀／課文默書共用） ----------------
     課文錄音按「一課課文一個bundle」放喺 audio/text/<課文id>.mp3，
     audio/text/manifest.json 記低每句（s0,s1…）同每個短語（p0,p1…）喺bundle入面
     嘅開始時間、長度同逐字時間標記。同一課連續播多段錄音時，重用同一個
     Audio物件（只係seek去另一段），所以連續朗讀唔會每句都重新下載／閃遮罩。
     冇錄音（manifest冇呢段）或者播唔到，就用裝置內置粵語朗讀頂住。 */
  var textAudio = null, textAudioSrc = "", textTok = 0;

  function stopTextAudio() {
    textTok++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (textAudio) { try { textAudio.pause(); } catch (e) {} }
    activeClipAudio = null;
    stopClipKaraoke();
    audioLoadToken++;
    var ov = el("audio-loading-overlay");
    if (ov) ov.hidden = true;
  }

  function speakTextEx(text, statusEl, spans, rate, onEnd) {
    if (!("speechSynthesis" in window)) {
      setStatus(statusEl, t("tts_unsupported"));
      return;
    }
    refreshVoices();
    var voice = pickCantoneseVoice();
    setStatus(statusEl, voice && /^zh-HK/i.test(voice.lang) ? "" : t("tts_no_canto"));
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK";
    if (voice) u.voice = voice;
    u.rate = rate || 0.85;
    attachKaraoke(u, spans);
    if (onEnd) {
      var prevEnd = u.onend, prevErr = u.onerror;
      u.onend = function () { if (prevEnd) prevEnd(); onEnd(); };
      u.onerror = function (ev) {
        if (prevErr) prevErr();
        if (!ev || (ev.error !== "canceled" && ev.error !== "interrupted")) onEnd();
      };
    }
    speechSynthesis.speak(u);
  }

  // o: { text（後備朗讀用）, spans, totalLen, rate（錄音播放速度）, ttsRate（後備朗讀速度）,
  //      statusEl, onEnd }。onEnd 只會喺「呢段自然播完」先會call（被打斷唔會）。
  function playTextClip(tid, clipKey, o) {
    stopTextAudio();
    var tok = textTok;
    var finished = false;
    function alive() { return tok === textTok; }
    function finish() { if (finished || !alive()) return; finished = true; if (o.onEnd) o.onEnd(); }
    function viaTts() {
      if (!alive() || finished) return;
      activeClipAudio = null;
      stopClipKaraoke();
      speakTextEx(o.text, o.statusEl, o.spans, o.ttsRate, finish);
    }
    var ent = textManifest && textManifest[tid];
    var entry = ent && ent.clips && ent.clips[clipKey];
    if (!entry || !ent.bundle) { viaTts(); return; }

    var src = "audio/text/" + ent.bundle + ".mp3";
    if (!textAudio || textAudioSrc !== src || textAudio.error) {
      textAudio = new Audio(src);
      textAudio.preload = "auto";
      textAudioSrc = src;
    }
    var audio = textAudio;
    var rate = o.rate || 1;
    var loadTok = audio.readyState < 2 ? showAudioLoading() : null;
    var timer = null;

    function cleanup() {
      audio.removeEventListener("error", onErr);
      audio.removeEventListener("playing", onPlaying);
      audio.removeEventListener("loadedmetadata", begin);
    }
    function onErr() {
      cleanup();
      if (loadTok != null) hideAudioLoading(loadTok);
      if (timer) clearTimeout(timer);
      try { audio.pause(); } catch (e) {}
      viaTts();
    }
    function onPlaying() {
      audio.removeEventListener("playing", onPlaying);
      if (loadTok != null) hideAudioLoading(loadTok);
      if (!alive()) { try { audio.pause(); } catch (e) {} return; }
      activeClipAudio = audio;
      runClipKaraoke(audio, entry.duration, o.spans, o.totalLen, entry.marks, null, rate);
      timer = setTimeout(function () {
        if (!alive()) return;
        try { audio.pause(); } catch (e) {}
        stopClipKaraoke();
        activeClipAudio = null;
        cleanup();
        if (o.spans) karaokeComplete(o.spans);
        finish();
      }, Math.max(0, entry.duration * 1000 / rate - 60));
    }
    function begin() {
      audio.removeEventListener("loadedmetadata", begin);
      if (!alive()) { if (loadTok != null) hideAudioLoading(loadTok); return; }
      try { audio.playbackRate = rate; } catch (e) {}
      try { audio.currentTime = entry.start; } catch (e) {}
      audio.addEventListener("playing", onPlaying);
      var pr = audio.play();
      if (pr && pr.catch) pr.catch(onErr);
    }
    audio.addEventListener("error", onErr);
    if (audio.readyState >= 1) begin();
    else audio.addEventListener("loadedmetadata", begin);
  }

  var MARK_EN = {
    "逗號": "comma", "頓號": "enumeration comma", "分號": "semicolon", "冒號": "colon",
    "句號": "full stop", "問號": "question mark", "感嘆號": "exclamation mark",
    "開引號": "opening quote", "閂引號": "closing quote",
    "開雙引號": "opening double quote", "閂雙引號": "closing double quote",
    "開書名號": "opening title mark", "閂書名號": "closing title mark",
    "開括號": "opening bracket", "閂括號": "closing bracket",
    "破折號": "dash", "省略號": "ellipsis"
  };

  function currentTextEntry() {
    if (!DATA || !DATA.texts || !state.lesson) return null;
    return DATA.texts[wordKey(state.grade, state.book, state.lesson)] || null;
  }

  function updateTextEntry() {
    var box = el("text-entry");
    if (box) box.hidden = !currentTextEntry();
  }

  /* ---------------- 課文朗讀 ----------------
     成篇課文分句顯示；撳邊句就讀邊句（跟住讀到嘅字著色）；亦可以「成篇朗讀」
     由頭連續讀，或者暫停；慢速／正常速度兩種。 */
  (function () {
    var scrim = el("tr-scrim");
    var tr = { entry: null, sents: [], speed: "normal", all: false, cur: -1, resumeAt: null, playing: false };
    var lastFocused = null;

    function rates() { return tr.speed === "slow" ? { audio: 0.75, tts: 0.6 } : { audio: 1, tts: 0.85 }; }

    function setActive(i) {
      tr.sents.forEach(function (s, j) { s.el.classList.toggle("is-active", j === i); });
    }
    function setPlayLabel() {
      el("tr-playall").textContent = tr.all ? t("tr_pause") : t("tr_playall");
    }

    function build() {
      var body = el("tr-body");
      body.innerHTML = "";
      tr.sents = [];
      tr.entry.paragraphs.forEach(function (p) {
        var pe = document.createElement("p");
        pe.className = "tr-par";
        p.sentences.forEach(function (s) {
          var se = document.createElement("span");
          se.className = "tr-sent";
          se.tabIndex = 0;
          se.setAttribute("role", "button");
          var spans = renderKaraoke(se, s.text, [], "char");
          var idx = tr.sents.length;
          tr.sents.push({ id: s.id, text: s.text, el: se, spans: spans });
          se.addEventListener("click", function () { onTap(idx); });
          se.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onTap(idx); }
          });
          pe.appendChild(se);
        });
        body.appendChild(pe);
      });
    }

    function endAll() {
      tr.all = false; tr.cur = -1; tr.resumeAt = null; tr.playing = false;
      setActive(-1); setPlayLabel();
    }

    function playSent(i) {
      var s = tr.sents[i];
      if (!s) { endAll(); return; }
      tr.cur = i; tr.playing = true;
      // 其他句要變返實色（上一句如果被打斷，可能仲係淡色）
      tr.sents.forEach(function (x) { karaokeComplete(x.spans); });
      setActive(i);
      s.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      var r = rates();
      playTextClip(tr.entry.id, s.id, {
        text: s.text, spans: s.spans, totalLen: s.text.length,
        rate: r.audio, ttsRate: r.tts, statusEl: el("tr-status"),
        onEnd: function () {
          tr.playing = false;
          if (tr.all && i + 1 < tr.sents.length) playSent(i + 1);
          else if (tr.all) endAll();
          else setActive(-1);
        }
      });
    }

    function onTap(i) { playSent(i); }

    function togglePlayAll() {
      if (tr.all) {
        tr.all = false;
        tr.resumeAt = tr.cur;
        tr.playing = false;
        stopTextAudio();
        tr.sents.forEach(function (x) { karaokeComplete(x.spans); });
        setPlayLabel();
      } else {
        tr.all = true;
        setPlayLabel();
        playSent(tr.resumeAt != null && tr.resumeAt >= 0 ? tr.resumeAt : 0);
        tr.resumeAt = null;
      }
    }

    function setSpeed(sp) {
      tr.speed = sp;
      document.querySelectorAll("#tr-speed .dict-chip").forEach(function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-speed") === sp ? "true" : "false");
      });
      if (tr.playing && tr.cur >= 0) playSent(tr.cur); // 讀緊嘅話，用新速度由呢句重讀
    }

    function open() {
      var entry = currentTextEntry();
      if (!entry) return;
      tr.entry = entry; tr.all = false; tr.cur = -1; tr.resumeAt = null; tr.playing = false;
      el("tr-title").textContent = state.lesson;
      build();
      setPlayLabel();
      setStatus(el("tr-status"), textManifest && textManifest[entry.id] ? "" : t("tr_no_audio"));
      lastFocused = document.activeElement;
      scrim.hidden = false;
      document.body.style.overflow = "hidden";
      el("tr-body").scrollTop = 0;
      el("tr-close").focus();
    }

    function close() {
      stopTextAudio();
      tr.all = false; tr.playing = false;
      scrim.hidden = true;
      document.body.style.overflow = "";
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    el("text-read-open").addEventListener("click", open);
    el("tr-close").addEventListener("click", close);
    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    el("tr-playall").addEventListener("click", togglePlayAll);
    document.querySelectorAll("#tr-speed .dict-chip").forEach(function (b) {
      b.addEventListener("click", function () { setSpeed(b.getAttribute("data-speed")); });
    });
    document.addEventListener("keydown", function (e) {
      if (!scrim.hidden && e.key === "Escape") close();
    });
  })();

  /* ---------------- 課文默書 ----------------
     逐個短語（用逗號、頓號、冒號、句號等標點切開）按課文次序讀出，標點讀做標點名
     （「開引號」「逗號」…），學生要連標點一齊寫。撳「下一個」先讀下一個。 */
  (function () {
    var scrim = el("td-scrim");
    var td = { entry: null, full: [], range: [0, 0], pend: null, queue: [], idx: 0, reads: 1, mode: "start", lastNextAt: 0, gen: 0 };
    var endAudio = null;
    var lastFocused = null;

    function stopAll() {
      td.gen++;
      stopTextAudio();
      if (endAudio) { try { endAudio.pause(); } catch (e) {} endAudio = null; }
    }

    function showMode(m) {
      td.mode = m;
      el("td-setup").hidden = m !== "start";
      el("td-play").hidden = m !== "play";
      el("td-done").hidden = m !== "done";
      el("td-sub").textContent = m === "start" ? t("td_sub_start") : m === "play" ? t("td_sub_play") : t("td_sub_done");
      setStatus(el("td-status"), "");
      el("td-body").scrollTop = 0;
    }

    function presentMarks(entry) {
      var all = (DATA && DATA.markNames) || {};
      var text = entry.paragraphs.map(function (p) { return p.sentences.map(function (s) { return s.text; }).join(""); }).join("");
      var seenName = {}, out = [];
      Object.keys(all).forEach(function (sym) {
        if (text.indexOf(sym) < 0) return;
        var name = all[sym];
        if (seenName[name]) return;
        seenName[name] = true;
        out.push([sym.length > 1 ? sym : sym, name]);
      });
      return out;
    }

    function onPick(i) {
      if (td.pend == null) { td.pend = i; td.range = [i, i]; }
      else { td.range = [Math.min(td.pend, i), Math.max(td.pend, i)]; td.pend = null; }
      refreshRange();
    }

    function refreshRange() {
      var n = td.full.length;
      var a = td.range ? td.range[0] : -1, b = td.range ? td.range[1] : -2;
      var stb = el("td-start-btn");
      if (stb) stb.disabled = !td.full.length || !td.range;
      (td.phEls || []).forEach(function (e, i) {
        var inside = i >= a && i <= b;
        e.classList.toggle("in", inside);
        e.classList.toggle("edge", inside && (i === a || i === b));
      });
      var sum = el("td-range-sum");
      if (sum) {
        if (!td.range) sum.textContent = t("td_range_none");
        else if (td.pend != null) sum.textContent = t("td_range_pick_end", { a: td.pend + 1 });
        else if (a === 0 && b === n - 1) sum.textContent = t("td_range_sel_all", { n: n });
        else sum.textContent = t("td_range_sel", { a: a + 1, b: b + 1, c: b - a + 1, n: n });
      }
    }

    function renderStart() {
      var box = el("td-setup");
      box.innerHTML = "";
      var nm = document.createElement("div");
      nm.className = "td-lesson-name";
      nm.textContent = state.lesson;
      box.appendChild(nm);
      var info = document.createElement("p");
      info.className = "td-info";
      info.innerHTML = t("td_info");
      box.appendChild(info);

      var lr = document.createElement("div");
      lr.className = "dict-toolbar";
      var rl = document.createElement("div");
      rl.className = "dict-label"; rl.textContent = t("td_range");
      var allb = document.createElement("button");
      allb.type = "button"; allb.className = "dict-link"; allb.textContent = t("td_range_all");
      allb.addEventListener("click", function () { td.range = [0, td.full.length - 1]; td.pend = null; refreshRange(); });
      lr.appendChild(rl); lr.appendChild(allb);
      box.appendChild(lr);
      var paras = td.entry.paragraphs;
      if (paras.length >= 2 && paras.length <= 10) {
        var pc = document.createElement("div");
        pc.className = "dict-chips";
        pc.style.marginBottom = "8px";
        var startAt = 0;
        paras.forEach(function (p, pi) {
          var cnt = 0;
          p.sentences.forEach(function (s) { cnt += s.phrases.length; });
          var a = startAt, b = startAt + cnt - 1;
          startAt += cnt;
          var c = document.createElement("button");
          c.type = "button"; c.className = "dict-chip";
          c.textContent = t("td_para", { n: pi + 1 });
          c.setAttribute("aria-pressed", "false");
          c.addEventListener("click", function () { td.range = [a, b]; td.pend = null; refreshRange(); });
          pc.appendChild(c);
        });
        box.appendChild(pc);
      }
      var hint = document.createElement("p");
      hint.className = "td-info"; hint.style.margin = "0 0 6px"; hint.style.fontSize = "12.5px";
      hint.textContent = t("td_range_hint");
      box.appendChild(hint);
      var pick = document.createElement("div");
      pick.className = "td-pick-box";
      td.phEls = [];
      var gi = 0;
      td.entry.paragraphs.forEach(function (p) {
        var pe = document.createElement("p");
        pe.className = "tr-par";
        p.sentences.forEach(function (s) {
          s.phrases.forEach(function (ph) {
            var idx = gi++;
            var sp = document.createElement("span");
            sp.className = "td-ph";
            sp.textContent = ph.text;
            sp.addEventListener("click", function () { onPick(idx); });
            td.phEls.push(sp);
            pe.appendChild(sp);
          });
        });
        pick.appendChild(pe);
      });
      box.appendChild(pick);
      var sum = document.createElement("div");
      sum.className = "td-range-sum"; sum.id = "td-range-sum"; sum.setAttribute("aria-live", "polite");
      box.appendChild(sum);
      refreshRange();

      var marks = presentMarks(td.entry);
      if (marks.length) {
        var l1 = document.createElement("div");
        l1.className = "dict-label"; l1.textContent = t("td_legend");
        box.appendChild(l1);
        var lg = document.createElement("div");
        lg.className = "td-legend";
        marks.forEach(function (m) {
          var sp = document.createElement("span");
          var b = document.createElement("b"); b.textContent = m[0];
          sp.appendChild(b);
          sp.appendChild(document.createTextNode(m[1]));
          if (siteLang === "en" && MARK_EN[m[1]]) {
            var i = document.createElement("i"); i.textContent = MARK_EN[m[1]];
            sp.appendChild(i);
          }
          lg.appendChild(sp);
        });
        box.appendChild(lg);
      }

      var l2 = document.createElement("div");
      l2.className = "dict-label"; l2.textContent = t("td_reads");
      box.appendChild(l2);
      var rd = document.createElement("div");
      rd.className = "dict-chips";
      [1, 2].forEach(function (n) {
        var c = document.createElement("button");
        c.type = "button"; c.className = "dict-chip";
        c.textContent = t("td_reads_n", { n: n });
        c.setAttribute("aria-pressed", td.reads === n ? "true" : "false");
        c.addEventListener("click", function () { td.reads = n; renderStart(); });
        rd.appendChild(c);
      });
      box.appendChild(rd);

      var row = document.createElement("div");
      row.className = "td-start-row";
      var st = document.createElement("button");
      st.type = "button"; st.className = "dict-btn dict-btn--primary dict-btn--big";
      st.textContent = t("td_start");
      st.id = "td-start-btn";
      st.disabled = !td.full.length || !td.range;
      st.addEventListener("click", start);
      row.appendChild(st);
      box.appendChild(row);
    }

    function playPhrase(slow) {
      var p = td.queue[td.idx];
      if (!p) return;
      var gen = ++td.gen;
      var n = 0;
      var rate = slow ? 0.75 : 1, ttsRate = slow ? 0.55 : 0.75;
      function once() {
        playTextClip(td.entry.id, p.id, {
          text: p.say, spans: null, totalLen: 0, rate: rate, ttsRate: ttsRate, statusEl: el("td-status"),
          onEnd: function () {
            n++;
            if (n < td.reads) setTimeout(function () { if (gen === td.gen && !scrim.hidden) once(); }, 1600);
          }
        });
      }
      once();
    }

    function resetExitRow() {
      el("td-exit-row").innerHTML = '<button type="button" class="dict-link" id="td-exit">' + t("dict_exit") + '</button>';
      el("td-exit").addEventListener("click", requestExit);
    }
    function requestExit() {
      if (td.mode !== "play") { close(); return; }
      var row = el("td-exit-row");
      row.innerHTML = '<span>' + t("dict_exit_confirm") + '</span>' +
        '<button type="button" class="dict-link" id="td-exit-yes">' + t("dict_exit_yes") + '</button>' +
        '<button type="button" class="dict-link" id="td-exit-no">' + t("dict_exit_no") + '</button>';
      el("td-exit-yes").addEventListener("click", close);
      el("td-exit-no").addEventListener("click", resetExitRow);
      el("td-exit-no").focus();
    }

    function renderItem() {
      var total = td.queue.length;
      el("td-progress-text").innerHTML = t("td_progress", { i: td.idx + 1, n: total });
      el("td-bar-fill").style.width = (td.idx / total * 100) + "%";
      el("td-next").textContent = td.idx === total - 1 ? t("dict_finish") : t("dict_next");
      resetExitRow();
    }

    function start() {
      if (!td.full.length || !td.range) return;
      td.pend = null;
      td.queue = td.full.slice(td.range[0], td.range[1] + 1);
      if (!td.queue.length) return;
      stopAll();
      td.idx = 0;
      td.lastNextAt = Date.now();
      showMode("play");
      renderItem();
      playPhrase(false);
      el("td-next").focus();
    }

    function next() {
      if (td.mode !== "play") return;
      var now = Date.now();
      if (now - td.lastNextAt < 450) return;
      td.lastNextAt = now;
      if (td.idx >= td.queue.length - 1) { finish(); return; }
      td.idx++;
      renderItem();
      playPhrase(false);
    }

    function speakEnd() {
      stopAll();
      var gen = td.gen;
      var statusEl = el("td-status");
      var en = siteLang === "en";
      var text = t("dict_end_speech");
      var fell = false;
      function fallback() {
        if (fell || td.gen !== gen || scrim.hidden) return;
        fell = true;
        if (en) speakGloss(text, "en", statusEl, null); else speakText(text, statusEl, null);
      }
      var audio = new Audio(en ? "audio/dictation_end_en.mp3" : "audio/dictation_end.mp3");
      endAudio = audio;
      audio.addEventListener("error", fallback);
      audio.play().catch(fallback);
    }

    function finish() {
      stopAll();
      el("td-bar-fill").style.width = "100%";
      el("td-reminder").textContent = t("td_reminder", { n: td.queue.length });
      var box = el("td-answer-text");
      box.hidden = true; box.innerHTML = "";
      el("td-show-text").textContent = t("td_show_text");
      el("td-show-text").setAttribute("aria-expanded", "false");
      showMode("done");
      el("td-show-text").focus();
      speakEnd();
    }

    function toggleText() {
      var box = el("td-answer-text");
      var open = box.hidden;
      if (open && !box.childNodes.length) {
        td.entry.paragraphs.forEach(function (p) {
          var pe = document.createElement("p");
          pe.className = "tr-par";
          pe.textContent = p.sentences.map(function (s) { return s.text; }).join("");
          box.appendChild(pe);
        });
      }
      box.hidden = !open;
      el("td-show-text").textContent = open ? t("td_hide_text") : t("td_show_text");
      el("td-show-text").setAttribute("aria-expanded", open ? "true" : "false");
      if (open) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function open() {
      var entry = currentTextEntry();
      if (!entry) return;
      td.entry = entry;
      td.full = [];
      entry.paragraphs.forEach(function (p) {
        p.sentences.forEach(function (s) {
          s.phrases.forEach(function (ph) { td.full.push(ph); });
        });
      });
      td.queue = [];
      td.range = null;
      td.pend = null;
      td.idx = 0;
      showMode("start");
      renderStart();
      setStatus(el("td-status"), textManifest && textManifest[entry.id] ? "" : t("tr_no_audio"));
      lastFocused = document.activeElement;
      scrim.hidden = false;
      document.body.style.overflow = "hidden";
      el("td-close").focus();
    }

    function close() {
      stopAll();
      scrim.hidden = true;
      document.body.style.overflow = "";
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    el("text-dict-open").addEventListener("click", open);
    el("td-close").addEventListener("click", requestExit);
    scrim.addEventListener("click", function (e) { if (e.target === scrim) requestExit(); });
    el("td-replay").addEventListener("click", function () { if (td.mode === "play") playPhrase(false); });
    el("td-slow").addEventListener("click", function () { if (td.mode === "play") playPhrase(true); });
    el("td-next").addEventListener("click", next);
    el("td-exit").addEventListener("click", requestExit);
    el("td-show-text").addEventListener("click", toggleText);
    el("td-end-say").addEventListener("click", speakEnd);
    el("td-again").addEventListener("click", start);
    el("td-back").addEventListener("click", function () { stopAll(); showMode("start"); renderStart(); });
    document.addEventListener("keydown", function (e) {
      if (scrim.hidden) return;
      if (e.key === "Escape") { requestExit(); return; }
      if (td.mode === "play" && e.key === "ArrowRight") { e.preventDefault(); next(); }
    });
  })();

  /* ---------------- Boot ---------------- */

  function boot(data, strokes, manifest, tManifest) {
    DATA = data;
    STROKES = strokes;
    audioManifest = manifest || {};
    textManifest = tManifest || {};
    renderGrades();
  }

  Promise.all([
    fetch("data.json").then(function (r) { return r.json(); }),
    fetch("strokes.json").then(function (r) { return r.json(); }),
    fetch("audio/bundles/manifest.json").then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    fetch("audio/text/manifest.json").then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    fetch("texts.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (results) {
    if (results[4] && results[4].texts) {
      results[0].texts = results[4].texts;
      results[0].markNames = results[4].markNames || {};
    }
    boot(results[0], results[1], results[2], results[3]);
  }).catch(function (err) {
    el("grid-grade").innerHTML = '<p class="empty-note">' + t("load_fail") + '</p>';
    console.error(err);
  });
})();
</script>
</body>
</html>
